/* ---------- Excel: template, export, import ----------
   One format for all three: the template, the export and what the
   importer reads are the same workbook. Sheets and columns are found
   by their titles, not their position, and rows are matched by project
   CODE and person NAME, not by an internal id, so a hand-made sheet
   works as long as the titles are right. Nothing is applied until the
   preview has been read and confirmed. */
const norm=t=>String(t??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const XL_SYN={
  proyek:{code:['kode','kodeproyek','id','idproyek','projectcode','code'],name:['namaproyek','nama','proyek','project','projectname'],fac:['fasilitas','facility','lokasi'],phase:['fase','phase','tahap'],cx:['kompleksitas','complexity','tingkat'],start:['mulai','tanggalmulai','start','startdate'],end:['selesai','tanggalselesai','end','enddate','finish'],prog:['progres','progress']},
  personel:{name:['nama','namapersonel','personel','name','pegawai'],role:['disiplin','discipline','peran','role'],level:['level','jenjang','title','jabatan','seniority'],cap:['kapasitas','capacity']},
  penugasan:{code:['kodeproyek','kode','proyek','project','idproyek'],person:['namapersonel','personel','nama','name','pegawai'],alloc:['alokasi','allocation','persen'],role:['disiplin','discipline','peran']}
};
const XL_SHEET={proyek:['proyek','projects','project'],personel:['personel','people','pegawai','tim'],penugasan:['penugasan','assignments','alokasi'],bobot:['bobotfase','bobot','phaseweights'],peran:['faktorperan','roles'],kx:['kompleksitas','complexity'],lvl:['faktorlevel','faktorjenjang']};
/* a cell's value, whatever Excel kept it as: text, number, date, formula, rich text */
const cv=v=>{if(v==null)return '';if(v instanceof Date)return v;if(typeof v==='object'){if('result' in v)return cv(v.result);if(v.richText)return v.richText.map(t=>t.text).join('');if('text' in v)return cv(v.text);if(v.error)return ''}return typeof v==='string'?v.trim():v};
const toNum=v=>{if(typeof v==='number')return v;const s=String(v??'').replace('%','').replace(',','.').trim();if(s==='')return null;const n=Number(s);return isNaN(n)?NaN:n};
const toPhase=v=>{const k=norm(v);if(!k)return null;if(/^(ini|init)/.test(k))return 'Inisiasi';if(/^(pre|pra)/.test(k)||k==='feedpre')return 'Pre-FEED';if(k==='feed')return 'FEED';if(/^(ded|detail)/.test(k))return 'DED';return undefined};
const toCx=v=>{const k=norm(v);if(!k)return null;if(['1','rendah','low','r','l'].includes(k))return 1;if(['2','sedang','medium','med','s','m'].includes(k))return 2;if(['3','tinggi','high','t','h'].includes(k))return 3;return undefined};
const toRole=v=>{const k=norm(v);if(!k)return null;if(/lead|^pm$|projectmanager|koordinator/.test(k))return 'Lead Project';if(/process|proses/.test(k))return 'Process';if(/mech|static|rotating|mekanik/.test(k))return 'Mechanical';if(/pip/.test(k))return 'Piping';if(/civil|struct|sipil/.test(k))return 'Civil/Structure';if(/elec|listrik/.test(k))return 'Electrical';if(/instr|control|kontrol/.test(k))return 'Instrument';if(/doccon|documentcontrol|dokumen|^dc$/.test(k))return 'DocCon';return undefined};
const toLevel=v=>{const k=norm(v);if(!k)return null;if(/^(jun|jr|pemula)/.test(k))return 'Junior';if(/^(mid|pro|madya)/.test(k))return 'Middle';if(/^(sen|sr|ahli|utama)/.test(k))return 'Senior';return undefined};
const MON={jan:1,januari:1,january:1,feb:2,februari:2,february:2,mar:3,maret:3,march:3,apr:4,april:4,mei:5,may:5,jun:6,juni:6,june:6,jul:7,juli:7,july:7,agu:8,agt:8,agustus:8,aug:8,august:8,sep:9,sept:9,september:9,okt:10,oktober:10,oct:10,october:10,nov:11,november:11,des:12,desember:12,dec:12,december:12};
const iso=(y,m,d)=>{if(y<100)y+=2000;const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:undefined};
/* null = blank, undefined = not a date */
function toDate(v){
  if(v===''||v==null)return null;
  if(v instanceof Date)return isNaN(v)?undefined:v.toISOString().slice(0,10);
  if(typeof v==='number')return v>20000&&v<80000?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):undefined;
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return iso(+m[1],+m[2],+m[3]);
  /* day first: this is an Indonesian workbook */
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))return iso(+m[3],+m[2],+m[1]);
  if(m=s.match(/^(\d{1,2})[\s-]+([A-Za-z]+)\.?[\s-]+(\d{2,4})/)){const mo=MON[m[2].toLowerCase()];return mo?iso(+m[3],mo,+m[1]):undefined}
  return undefined}
const slug=t=>String(t??'').trim().replace(/\s+/g,' ').toLowerCase();

/* ── reading ────────────────────────────────────────────── */
function xlReadSheet(ws,syn,issues,label){
  /* the title row is the first of the top ten that has two known titles */
  let hr=0,cols={};
  for(let n=1;n<=Math.min(10,ws.rowCount)&&!hr;n++){
    const c={};ws.getRow(n).eachCell({includeEmpty:false},(cell,ci)=>{const h=norm(cv(cell.value));if(!h)return;for(const [k,list] of Object.entries(syn)){if(c[k])continue;if(list.includes(h)||list.some(s=>s.length>=5&&h.startsWith(s))){c[k]=ci;break}}});
    if(Object.keys(c).length>=2){hr=n;cols=c}}
  if(!hr){issues.push({lvl:'err',sheet:label,row:0,msg:'Judul kolom tidak dikenali. Pakai judul dari template.'});return null}
  const rows=[];
  for(let n=hr+1;n<=ws.rowCount;n++){
    const row=ws.getRow(n);const v={};let any=false;
    for(const [k,ci] of Object.entries(cols)){const x=cv(row.getCell(ci).value);v[k]=x;if(x!=='')any=true}
    if(any)rows.push({n,v})}
  return {rows,cols}}
async function xlParse(buf){
  if(!window.ExcelJS)throw new Error('Library Excel belum termuat. Periksa koneksi internet.');
  const wb=new ExcelJS.Workbook();
  try{await wb.xlsx.load(buf)}catch(e){throw new Error('File ini bukan workbook Excel (.xlsx) yang valid')}
  const find=k=>wb.worksheets.find(w=>XL_SHEET[k].includes(norm(w.name)));
  const issues=[],P={issues,sheets:[]};
  const sp=find('proyek'),se=find('personel'),sa=find('penugasan');
  if(!sp&&!se&&!sa)throw new Error('Tidak ada sheet Proyek, Personel, atau Penugasan. Pakai template.');
  if(sp){P.sheets.push('Proyek');P.proyek=xlReadSheet(sp,XL_SYN.proyek,issues,'Proyek')}
  if(se){P.sheets.push('Personel');P.personel=xlReadSheet(se,XL_SYN.personel,issues,'Personel')}
  if(sa){P.sheets.push('Penugasan');P.penugasan=xlReadSheet(sa,XL_SYN.penugasan,issues,'Penugasan')}
  /* the weights, if the workbook carries them */
  const patch={phaseW:{},roleF:{},cxF:{}};let n=0;
  const sb=find('bobot'),sr=find('peran'),sk=find('kx');
  if(sb){P.sheets.push('Bobot Fase');const r=xlReadSheet(sb,{ph:['fase','phase'],w:['bobot','weight']},issues,'Bobot Fase');r&&r.rows.forEach(({n:rn,v})=>{const ph=toPhase(v.ph),w=toNum(v.w);if(!ph||w==null||isNaN(w)||w<0)issues.push({lvl:'err',sheet:'Bobot Fase',row:rn,msg:`Baris tidak valid: fase "${v.ph}" bobot "${v.w}"`});else{patch.phaseW[ph]=w;n++}})}
  if(sr){P.sheets.push('Faktor Peran');const syn={role:['disiplin','discipline','peran']};PH.forEach(ph=>syn[ph]=[norm(ph)]);const r=xlReadSheet(sr,syn,issues,'Faktor Peran');r&&r.rows.forEach(({n:rn,v})=>{const ro=toRole(v.role);if(!ro){issues.push({lvl:'err',sheet:'Faktor Peran',row:rn,msg:`Disiplin "${v.role}" tidak dikenal`});return}PH.forEach(ph=>{if(v[ph]===''||v[ph]==null)return;const w=toNum(v[ph]);if(w==null||isNaN(w)||w<0)issues.push({lvl:'err',sheet:'Faktor Peran',row:rn,msg:`Nilai ${ph} "${v[ph]}" tidak valid`});else{(patch.roleF[ro]=patch.roleF[ro]||{})[ph]=w;n++}})})}
  if(sk){P.sheets.push('Kompleksitas');const r=xlReadSheet(sk,{lv:['level','kompleksitas','tingkat'],f:['faktor','factor']},issues,'Kompleksitas');r&&r.rows.forEach(({n:rn,v})=>{const c=toCx(v.lv),w=toNum(v.f);if(!c||w==null||isNaN(w)||w<0)issues.push({lvl:'err',sheet:'Kompleksitas',row:rn,msg:`Baris tidak valid: "${v.lv}" faktor "${v.f}"`});else{patch.cxF[c]=w;n++}})}
  const sl=find('lvl');
  if(sl){P.sheets.push('Faktor Level');patch.lvF={};const r=xlReadSheet(sl,{lv:['level','jenjang'],f:['faktor','factor']},issues,'Faktor Level');r&&r.rows.forEach(({n:rn,v})=>{const l=toLevel(v.lv),w=toNum(v.f);if(!l||w==null||isNaN(w)||w<=0)issues.push({lvl:'err',sheet:'Faktor Level',row:rn,msg:`Baris tidak valid: "${v.lv}" faktor "${v.f}"`});else{patch.lvF[l]=w;n++}})}
  P.patch=n?patch:null;
  return P}

/* ── planning: what the file would do, without doing it ── */
function xlPlan(P,mode){
  const issues=[...P.issues],today=new Date().toISOString().slice(0,10),stat={pNew:0,pUpd:0,eNew:0,eUpd:0,aNew:0,aUpd:0,skip:0,orphan:0,set:0};
  const err=(sheet,row,msg)=>{issues.push({lvl:'err',sheet,row,msg});stat.skip++},warn=(sheet,row,msg)=>issues.push({lvl:'warn',sheet,row,msg});
  const keep=(has,list)=>mode==='replace'&&has?[]:list.map(x=>({...x}));
  const R={projects:keep(!!P.proyek,S.projects),people:keep(!!P.personel,S.people),assigns:keep(!!P.penugasan,S.assigns),settings:JSON.parse(JSON.stringify(S.settings))};
  const byCode=new Map(R.projects.map(p=>[slug(p.id),p])),byName=new Map(R.people.map(e=>[slug(e.name),e]));
  const seenP=new Set(),seenE=new Set(),seenA=new Set();

  (P.proyek?.rows||[]).forEach(({n,v})=>{
    const code=String(v.code??'').trim(),name=String(v.name??'').trim();
    if(!code)return err('Proyek',n,'Kode proyek kosong');
    if(seenP.has(slug(code)))warn('Proyek',n,`Kode ${code} muncul dua kali, baris ini memperbarui yang sebelumnya`);seenP.add(slug(code));
    const ph=toPhase(v.phase),cx=toCx(v.cx),st=toDate(v.start),en=toDate(v.end),pr=toNum(v.prog);
    if(ph===undefined)return err('Proyek',n,`Fase "${v.phase}" tidak dikenal. Pilih Inisiasi, Pre-FEED, FEED, atau DED`);
    if(cx===undefined)return err('Proyek',n,`Kompleksitas "${v.cx}" tidak dikenal. Pilih Rendah, Sedang, atau Tinggi`);
    if(st===undefined)return err('Proyek',n,`Tanggal mulai "${v.start}" tidak terbaca. Tulis seperti 15/01/2027`);
    if(en===undefined)return err('Proyek',n,`Tanggal selesai "${v.end}" tidak terbaca. Tulis seperti 15/01/2027`);
    if(pr!==null&&(isNaN(pr)||pr<0||pr>100))return err('Proyek',n,`Progres "${v.prog}" harus 0 sampai 100`);
    const ex=byCode.get(slug(code));
    if(ex){
      const c={};if(name)c.name=name;if(String(v.fac??'').trim())c.fac=String(v.fac).trim();if(ph)c.phase=ph;if(cx)c.cx=cx;if(st)c.start=st;if(en)c.end=en;if(pr!==null)c.progress=pr;
      const m={...ex,...c};if(m.end<m.start)return err('Proyek',n,`Selesai (${m.end}) lebih awal dari mulai (${m.start})`);
      if(Object.keys(c).some(k=>ex[k]!==c[k])){Object.assign(ex,c);stat.pUpd++}
    }else{
      if(!name)return err('Proyek',n,`Proyek baru ${code} butuh Nama Proyek`);
      if(!ph)return err('Proyek',n,`Proyek baru ${code} butuh Fase`);
      let s=st,e=en;if(!s||!e){warn('Proyek',n,`${code}: tanggal kosong, diisi otomatis. Ubah nanti bila perlu`);s=s||today;e=e||new Date(Date.parse(s)+180*864e5).toISOString().slice(0,10)}
      if(e<s)return err('Proyek',n,`Selesai (${e}) lebih awal dari mulai (${s})`);
      const p={id:code,name,fac:String(v.fac??'').trim(),phase:ph,cx:cx||2,start:s,end:e,progress:pr??0};
      R.projects.push(p);byCode.set(slug(code),p);stat.pNew++}
  });

  (P.personel?.rows||[]).forEach(({n,v})=>{
    const name=String(v.name??'').trim().replace(/\s+/g,' ');if(!name)return err('Personel',n,'Nama kosong');
    if(seenE.has(slug(name)))warn('Personel',n,`${name} muncul dua kali, baris ini memperbarui yang sebelumnya`);seenE.add(slug(name));
    const ro=toRole(v.role),cap=toNum(v.cap),lv=toLevel(v.level);
    if(ro===undefined)return err('Personel',n,`Disiplin "${v.role}" tidak dikenal untuk ${name}`);
    if(lv===undefined)return err('Personel',n,`Level "${v.level}" tidak dikenal untuk ${name}. Pilih Junior, Middle, atau Senior`);
    if(cap!==null&&(isNaN(cap)||cap<10||cap>100))return err('Personel',n,`Kapasitas ${name} harus 10 sampai 100`);
    const ex=byName.get(slug(name));
    if(ex){const c={};if(ro)c.role=ro;if(lv)c.level=lv;if(cap!==null)c.cap=cap;if(Object.keys(c).some(k=>(ex[k]??(k==='level'?'Middle':undefined))!==c[k])){Object.assign(ex,c);stat.eUpd++}}
    else{if(!ro)return err('Personel',n,`Personel baru ${name} butuh Disiplin`);const e={id:uid('e'),name,role:ro,level:lv||'Middle',cap:cap??100};R.people.push(e);byName.set(slug(name),e);stat.eNew++}
  });

  (P.penugasan?.rows||[]).forEach(({n,v})=>{
    const code=String(v.code??'').trim(),pn=String(v.person??'').trim().replace(/\s+/g,' ');
    if(!code||!pn)return err('Penugasan',n,'Kode Proyek dan Nama Personel wajib diisi');
    const pj=byCode.get(slug(code))||R.projects.find(p=>slug(p.name)===slug(code));
    if(!pj)return err('Penugasan',n,`Proyek "${code}" tidak ada. Isi dulu di sheet Proyek`);
    const al=toNum(v.alloc);
    if(al===null||isNaN(al)||al<0||al>100)return err('Penugasan',n,`Alokasi "${v.alloc}" harus 0 sampai 100`);
    let e=byName.get(slug(pn))||R.people.find(x=>x.id===pn);
    if(!e){
      const ro=toRole(v.role);
      if(!ro)return err('Penugasan',n,`Personel "${pn}" tidak ada. Tambahkan di sheet Personel, atau isi kolom Disiplin agar dibuat otomatis`);
      e={id:uid('e'),name:pn,role:ro,level:'Middle',cap:100};R.people.push(e);byName.set(slug(pn),e);stat.eNew++;warn('Penugasan',n,`${pn} dibuat otomatis sebagai ${ro} dengan kapasitas 100%`)}
    const key=pj.id+'|'+e.id;if(seenA.has(key))warn('Penugasan',n,`${e.name} di ${pj.id} muncul dua kali, memakai yang terakhir`);seenA.add(key);
    const ex=R.assigns.find(a=>a.p===pj.id&&a.e===e.id);
    if(ex){if(ex.alloc!==al){ex.alloc=al;stat.aUpd++}}else{R.assigns.push({id:uid('a'),p:pj.id,e:e.id,alloc:al});stat.aNew++}
  });

  /* nothing may point at a project or person that is gone */
  const ids={p:new Set(R.projects.map(p=>p.id)),e:new Set(R.people.map(e=>e.id))};
  const before=R.assigns.length;R.assigns=R.assigns.filter(a=>ids.p.has(a.p)&&ids.e.has(a.e));stat.orphan=before-R.assigns.length;

  if(P.patch){const s=R.settings,pt=P.patch;
    PH.forEach(ph=>{if(pt.phaseW[ph]!==undefined&&s.phaseW[ph]!==pt.phaseW[ph]){s.phaseW[ph]=pt.phaseW[ph];stat.set++}});
    Object.entries(pt.roleF).forEach(([r,o])=>Object.entries(o).forEach(([ph,w])=>{s.roleF[r]=s.roleF[r]||{};if(s.roleF[r][ph]!==w){s.roleF[r][ph]=w;stat.set++}}));
    if(pt.lvF){s.lvF=s.lvF||{...LVF0};Object.entries(pt.lvF).forEach(([l,w])=>{if(s.lvF[l]!==w){s.lvF[l]=w;stat.set++}})}
    Object.entries(pt.cxF).forEach(([c,w])=>{if(s.cxF[c]!==w){s.cxF[c]=w;stat.set++}})}
  /* how it would look: swap in, count, swap back, all in one tick */
  const old={projects:S.projects,people:S.people,assigns:S.assigns,settings:S.settings};
  let over=0;Object.assign(S,R);try{over=S.people.filter(e=>util(e.id)>S.settings.thr.high).length}finally{Object.assign(S,old)}
  const changes=stat.pNew+stat.pUpd+stat.eNew+stat.eUpd+stat.aNew+stat.aUpd+stat.set+stat.orphan+(mode==='replace'?Math.abs(R.projects.length-S.projects.length)+Math.abs(R.people.length-S.people.length)+Math.abs(R.assigns.length-S.assigns.length):0);
  return {R,issues,stat,over,changes}}

/* ── the preview ────────────────────────────────────────── */
let IMP=null;
function xlPreview(P,fname){
  IMP={mode:'merge'};
  openDialog(`<div class="dh"><div><h3>Tinjau impor</h3><div class="muted" style="font-size:13px">${esc(fname)} · sheet terbaca: ${esc(P.sheets.join(', '))}</div></div><button class="btn subtle icon-btn x" data-act="close" aria-label="Tutup">${ic('x')}</button></div>
    <div style="margin-bottom:8px">${seg('impmode',['Gabung','Ganti semua'],'Gabung')}</div><div class="muted" id="impDesc" style="font-size:13px;margin-bottom:14px"></div><div id="impBody"></div>
    <div class="foot"><button class="btn" data-act="close">Batal</button><button class="btn primary" id="impOk">Terapkan</button></div>`,{cls:'imp'});
  IMP.draw=()=>{
    const pl=IMP.plan=xlPlan(P,IMP.mode),s=pl.stat;
    $('#impDesc').textContent=IMP.mode==='merge'?'Proyek dicocokkan lewat kode, personel lewat nama. Yang sudah ada diperbarui, yang baru ditambahkan, yang tidak ada di file dibiarkan.':'Data pada sheet yang ada di file diganti seluruhnya oleh isi file. Data di sheet yang tidak ada di file tetap.';
    const box=(t,n,u)=>`<div class="card" style="box-shadow:none;border:1px solid var(--border);padding:12px"><div class="muted" style="font-size:12px">${t}</div><div style="font-size:20px;font-weight:600;line-height:28px">${n}<span class="muted" style="font-size:12px;font-weight:400"> baru</span></div><div class="muted" style="font-size:12px">${u} diperbarui</div></div>`;
    const shown=pl.issues.slice(0,12);
    const errs=pl.issues.filter(i=>i.lvl==='err').length,warns=pl.issues.length-errs;
    $('#impBody').innerHTML=`<div class="grid g3" style="gap:10px">${box('Proyek',s.pNew,s.pUpd)}${box('Personel',s.eNew,s.eUpd)}${box('Penugasan',s.aNew,s.aUpd)}</div>
      <div class="muted" style="font-size:12px;margin:10px 0">${[s.set?`${s.set} bobot diperbarui`:'',s.orphan?`${s.orphan} penugasan dibuang karena proyek atau personelnya tidak ada`:'',`Setelah impor: ${pl.over} personel overload`].filter(Boolean).join(' · ')}</div>
      ${pl.issues.length?`<div style="font-weight:600;margin:6px 0">${errs?`${errs} baris dilewati`:''}${errs&&warns?' · ':''}${warns?`${warns} catatan`:''}</div><div style="max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:4px">${shown.map(i=>`<div class="warnbox" style="margin:0;${i.lvl==='warn'?'background:var(--warning-soft);color:var(--warning)':''}">${ic('warn',16)}<span><b>${esc(i.sheet)}${i.row?` baris ${i.row}`:''}</b>: ${esc(i.msg)}</span></div>`).join('')}${pl.issues.length>12?`<div class="muted" style="font-size:12px">dan ${pl.issues.length-12} lainnya</div>`:''}</div>`:'<div class="warnbox okbox" style="margin:0">Semua baris terbaca dengan benar.</div>'}`;
    const ok=$('#impOk');ok.disabled=!pl.changes;ok.textContent=pl.changes?'Terapkan':'Tidak ada perubahan';ok.style.opacity=pl.changes?'':'.5';
    initSegs()};
  $('#impOk').onclick=()=>{const pl=IMP.plan;if(!pl.changes)return;const keepOld={projects:S.projects};
    S.projects=pl.R.projects;S.people=pl.R.people;S.assigns=pl.R.assigns;S.settings=pl.R.settings;
    markDirty();closeDialog();IMP=null;render();
    const s=pl.stat;toast(`Impor selesai: ${s.pNew} proyek baru, ${s.eNew} personel baru, ${s.aNew+s.aUpd} penugasan`)};
  IMP.draw()}
async function xlImportFile(buf,f){const P=await xlParse(buf);xlPreview(P,f.name);return 'Siap ditinjau'}

/* ── writing: the template and the export ───────────────── */
const xlDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
async function xlBook(kind){

/* ════════════════════════════════════════════════════════════
   Bencho components (MIT, bencho.dev/licence), ported from React
   to plain DOM so they live in this one-file app. The numbers and
   the comments are Bencho's; notes marked "here:" say what changed.
   ════════════════════════════════════════════════════════════ */

/* ── inlined from lab/spring ──────────────────────── */
/* Read once, the way the wheel and the pill nav do. A
   preference, not a live input. */
const stillness = () =>
  typeof window !== "undefined" &&
  !!window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

/* ══ Particles ════════════════════════════════════════════
   A shape made of dots. Move over it and the dots are pushed
   away from the pointer and spring home behind it; press and a
   shockwave throws them out, and they gather again into the
   NEXT shape — circle, square, flower, round again.

   ── ONE SET OF DOTS, MANY SHAPES ────────────────────────
   The dots never change, only where home is. Every shape is
   sampled to the same number of points, and a change of shape
   pairs each dot with a new home by angle round the middle, so
   the swarm sweeps round into the new outline rather than
   crossing itself.

   ── STRETCHED BY SPEED ──────────────────────────────────
   A dot at rest is round; a moving one is drawn a little long
   along the way it is going, which is what makes a burst read
   as a splash rather than a scatter of points.

   here: it is the app's logo, so it is drawn on a 100-unit square
   shown at 36px, with 130 dots, and the shapes are the app's own —
   rising bars (the workload), a ring (utilisation) and a tile. The
   dots start scattered and gather on load, so the mark assembles
   itself once; after that it only moves when touched. */
function Particles(canvas, { size = 36, reach = 30, force = 60, grain = "Fine" } = {}) {
  const still = stillness();
  const W = 100, H = 100, CX = W / 2, CY = H / 2;
  /* how many dots every shape is sampled to */
  const N = 130;
  const SHAPES = ["Bars", "Ring", "Tile"];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rr = (p, x, y, w, h, r) => { p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r); p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath(); };

  function outline(s) {
    const p = new Path2D();
    if (s === "Bars") { rr(p, 12, 58, 22, 30, 5); rr(p, 39, 37, 22, 51, 5); rr(p, 66, 12, 22, 76, 5); }
    /* the hole runs the other way round, so the fill is the ring */
    else if (s === "Ring") { p.arc(CX, CY, 44, 0, Math.PI * 2); p.moveTo(CX + 22, CY); p.arc(CX, CY, 22, 0, Math.PI * 2, true); }
    else rr(p, 14, 14, 72, 72, 16);
    return p;
  }

  /* ── N points, spread evenly over the inside of a shape ──
     A hex grid spaced so the shape holds about N of them — its
     area over N, which is the spacing that fills it evenly — then
     trimmed or topped up to exactly N. It was a fixed fine grid
     thinned by a stride, and the stride beat against the grid:
     the circle came out in zigzag bands. */
  function homes(s) {
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    const path = outline(s);
    let area = 0;
    for (let y = 1; y < H; y += 2) for (let x = 1; x < W; x += 2) if (g.isPointInPath(path, x, y)) area += 4;
    const sp = Math.sqrt((area / N) * (2 / Math.sqrt(3)));
    const rowH = (sp * Math.sqrt(3)) / 2;
    const pts = [];
    for (let y = rowH / 2, row = 0; y < H; y += rowH, row++)
      for (let x = sp / 2 + (row % 2) * (sp / 2); x < W; x += sp)
        if (g.isPointInPath(path, x, y)) pts.push([x, y]);
    /* within a few of N either way; drop evenly or repeat evenly */
    const out = [];
    for (let i = 0; i < N; i++) out.push(pts[Math.floor((i * pts.length) / N)]);
    return out;
  }
  const angle = (x, y) => Math.atan2(y - CY, x - CX);

  let dots = [], at = "Bars", hand = null, raf = 0;

  /* ── give every dot a home in a shape ────────────────── */
  const become = (s) => {
    at = s;
    const next = homes(s);
    if (!dots.length) {
      /* here: born scattered round the square, so the first frame
         gathers them in */
      dots = next.map(([x, y]) => still
        ? { hx: x, hy: y, x, y, vx: 0, vy: 0 }
        : { hx: x, hy: y, x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0 });
      return;
    }
    /* pair by angle round the middle, so the swarm sweeps */
    const a = dots.map((d, i) => [angle(d.x, d.y), i]).sort((p, q) => p[0] - q[0]);
    const b = next.map((h, i) => [angle(h[0], h[1]), i]).sort((p, q) => p[0] - q[0]);
    a.forEach(([, di], k) => {
      const h = next[b[k][1]];
      dots[di].hx = h[0]; dots[di].hy = h[1];
      if (still) { dots[di].x = h[0]; dots[di].y = h[1]; }
    });
  };

  const draw = () => {
    const x = canvas.getContext("2d");
    const k = canvas.width / W;
    x.setTransform(k, 0, 0, k, 0, 0);
    x.clearRect(0, 0, W, H);
    x.fillStyle = getComputedStyle(canvas).color;
    /* here: 1.9 and 2.7 were for a 480-unit field; the same feel
       on a 100-unit mark is a little under half that */
    const r = grain === "Coarse" ? 2.6 : 2.1;
    x.beginPath();
    for (const d of dots) {
      const sp = Math.hypot(d.vx, d.vy);
      if (sp < 0.3) {
        x.moveTo(d.x + r, d.y);
        x.arc(d.x, d.y, r, 0, Math.PI * 2);
      } else {
        /* long along its path, a little thin across it */
        const s = Math.min(2.6, 1 + sp * 0.12);
        const rot = Math.atan2(d.vy, d.vx);
        x.moveTo(d.x + Math.cos(rot) * r * s, d.y + Math.sin(rot) * r * s);
        x.ellipse(d.x, d.y, r * s, r / Math.sqrt(s), rot, 0, Math.PI * 2);
      }
    }
    x.fill();
  };

  const run = () => {
    if (raf) return;
    let prev = 0;
    const tick = (t) => {
      const dt = prev ? clamp((t - prev) / 16.67, 0, 2.5) : 1;
      prev = t;
      const h = hand;
      const R = clamp(reach, 30, 160);
      const S = (clamp(force, 0, 100) / 100) * 11;
      let busy = !!h;
      for (const d of dots) {
        if (h) {
          const dx = d.x - h.x, dy = d.y - h.y, dd = Math.hypot(dx, dy);
          if (dd < R && dd > 0.01) {
            const f = Math.pow(1 - dd / R, 2) * S;
            d.vx += (dx / dd) * f * dt;
            d.vy += (dy / dd) * f * dt;
          }
        }
        d.vx = (d.vx + (d.hx - d.x) * 0.05 * dt) * Math.pow(0.84, dt);
        d.vy = (d.vy + (d.hy - d.y) * 0.05 * dt) * Math.pow(0.84, dt);
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        if (Math.abs(d.hx - d.x) < 0.05 && Math.abs(d.hy - d.y) < 0.05 && Math.abs(d.vx) < 0.02 && Math.abs(d.vy) < 0.02) {
          d.x = d.hx; d.y = d.hy; d.vx = 0; d.vy = 0;
        } else busy = true;
      }
      draw();
      raf = busy ? requestAnimationFrame(tick) : 0;
    };
    raf = requestAnimationFrame(tick);
  };

  /* set up once */
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", "Logo Workload: titik-titik membentuk grafik. Tekan untuk mengganti bentuk.");
  become("Bars"); draw(); run();
  new MutationObserver(() => draw()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  const where = (e) => {
    const r = canvas.getBoundingClientRect();
    const k = r.width / W;
    return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
  };
  canvas.addEventListener("pointermove", (e) => { if (still) return; hand = where(e); run(); });
  canvas.addEventListener("pointerleave", () => { hand = null; run(); });
  canvas.addEventListener("pointerdown", (e) => {
    /* the shockwave, then the next shape */
    const p = where(e);
    if (!still) {
      const S = 0.4 + (clamp(force, 0, 100) / 100) * 1.2;
      /* here: the wave reaches the whole mark, and is scaled from
         the 480 field down to the 100 one */
      const RW = 200 * (W / 480) * 2, K = W / 480;
      for (const d of dots) {
        const dx = d.x - p.x, dy = d.y - p.y, dd = Math.hypot(dx, dy);
        if (dd > RW || dd < 0.01) continue;
        const f = (1 - dd / RW) * 30 * S * K;
        d.vx += (dx / dd) * f;
        d.vy += (dy / dd) * f;
      }
    }
    become(SHAPES[(SHAPES.indexOf(at) + 1) % SHAPES.length]);
    draw(); run();
  });
}

/* ══ Context meter ════════════════════════════════════════
   A model's context window as a field of dots, one per thousand
   tokens. Each kind of content fills its own band, column by column,
   in its own strength of ink, and the empty room is a faint grid.
   Point at a chip, or at any dot, and that kind lights while the rest
   fall back, and the big number rolls to its share. Compact folds the
   conversation down: its dots go out in a ripple from the far end,
   the bands after it close up, and the count rolls down with them.

   here: the window is the team's capacity, one dot per 0.1 FTE, and
   the kinds are the four phases. The two states are the raw
   allocation and the weighted load — applying the phase weights is
   the "compact": DED keeps most of its dots, Inisiasi gives most of
   its up. The weighted view is the one the app shows first.

   ── EVERY DOT IS AN INDEX ───────────────────────────────
   Dot i belongs to whichever kind's running total it falls inside,
   so a dot never moves: compacting changes which kind each index
   belongs to, and the colour change is the animation. A delay that
   grows along the indices that changed makes it a ripple rather
   than a cut.

   ── THE FIGURE POPS IN ──────────────────────────────────
   The Price flow block's number pop-in, recycled: a digit that
   changes rises a hair out of a 2px blur and lands a touch past
   its mark, left to right 70ms apart — from below when the figure
   grows, from above when it shrinks. Every digit is keyed by its
   place and its value, so one that did not change never moves. */
function Roll(el, text, up) {
  const chars = text.split("");
  const old = {};
  el.querySelectorAll(":scope > [data-place]").forEach((w) => (old[w.dataset.place] = w));
  const next = chars.map((c, i) => {
    /* places counted from the right, so a new leading digit does not
       shift the keys of the ones already there */
    const place = chars.length - 1 - i;
    if (!/[0-9]/.test(c)) {
      const key = `s${place}`;
      const w = old[key] || Object.assign(document.createElement("span"), { className: "ctx-sym" });
      w.dataset.place = key; w.textContent = c;
      return w;
    }
    const key = `p${place}`;
    const w = old[key] || Object.assign(document.createElement("span"), { className: "ctx-wheel" });
    w.dataset.place = key;
    const cur = w.querySelector(".ctx-digit:not([data-out])");
    if (!cur || cur.textContent !== c) {
      if (cur) {
        cur.dataset.out = 1;
        Object.assign(cur.style, { position: "absolute", left: 0, top: 0 });
        const a = cur.animate([{ opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(2px)" }], { duration: 160, fill: "forwards" });
        a.onfinish = () => cur.remove();
      }
      const d = Object.assign(document.createElement("span"), { className: "ctx-digit", textContent: c });
      w.appendChild(d);
      /* initial={false}: a wheel that is new has nothing to roll from */
      if (cur && !stillness())
        d.animate(
          [{ transform: `translateY(${up ? "0.18em" : "-0.18em"})`, opacity: 0, filter: "blur(2px)" },
           { transform: "translateY(0em)", opacity: 1, filter: "blur(0px)" }],
          { duration: 500, easing: "cubic-bezier(0.34, 1.45, 0.64, 1)", delay: i * 70, fill: "backwards" });
    }
    return w;
  });
  el.replaceChildren(...next);
}

function ContextMeter(root, { kinds, sizesRaw, sizesWeighted, window: WINDOW, title = "Kapasitas tim", unit = (d) => (d / 10).toLocaleString("id-ID", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) }) {
  /* 20 across, each an exact 11 by 11 on a 3px gap, so every one is
     the same true square; here the rows follow the team's size */
  const COLS = 20, DOT_W = 11, DOT_H = 11, GAP = 3;
  const ROWS = Math.max(1, Math.ceil(WINDOW / COLS));
  const SIZES = [sizesRaw, sizesWeighted];

  /* biggest first, as it stands before compacting: the order of the
     field and the chips alike. Fixed, so Compact shrinks in place
     rather than reshuffling the bands */
  const ORDER = kinds.map((_, i) => i).sort((a, b) => sizesRaw[b] - sizesRaw[a]);

  /* which kind each dot is, before and after compacting: running
     totals, a dot per unit. Both are fixed, so the dots that
     differ between them — and so the ripple's delays — are too */
  const ownersFor = (sizes) => {
    const out = [];
    ORDER.forEach((ci) => { for (let j = 0; j < Math.round(sizes[ci]) && out.length < WINDOW; j++) out.push(ci); });
    while (out.length < WINDOW) out.push(null);
    return out;
  };
  const OWNERS = [ownersFor(SIZES[0]), ownersFor(SIZES[1])];
  const FIRST = OWNERS[0].findIndex((o, i) => o !== OWNERS[1][i]);
  const LAST = OWNERS[0].reduce((l, o, i) => (o !== OWNERS[1][i] ? i : l), FIRST);
  /* the whole ripple fits inside the compact sound's squeeze: every dot
     that changes has started by RIPPLE ms, so the swap lands with the
     knock at ~280 rather than trailing on for a second after it.
     1 rather than 0 for the first, since 0 reads as "unchanged" */
  const RIPPLE = 220;
  const DELAY = OWNERS[0].map((o, i) => (o !== OWNERS[1][i] ? 1 + Math.round(((i - FIRST) / (LAST - FIRST || 1)) * RIPPLE) : 0));

  /* here: state 1, weighted, is where it opens */
  let compact = 1, hot = null, moved = false;
  let last = null, up = true;

  root.innerHTML = `<div class="ctx">
    <div class="ctx-head"><span class="ctx-title">${title}</span><button type="button" class="ctx-act"></button></div>
    <div class="ctx-figure" aria-live="polite"><span class="ctx-num"><span class="ctx-sr"></span><span class="ctx-roll" aria-hidden="true"></span></span><span class="ctx-of"></span></div>
    <div class="ctx-grid" aria-hidden="true" style="grid-template-rows:repeat(${ROWS}, ${DOT_H}px);grid-template-columns:repeat(${COLS}, ${DOT_W}px);gap:${GAP}px"></div>
    <div class="ctx-chips">${ORDER.map((ci) => `<button type="button" class="ctx-chip" data-k="${kinds[ci].id}"><i class="ctx-swatch" data-kind="${kinds[ci].id}"></i>${kinds[ci].name}</button>`).join("")}</div>
    <div class="ctx-of" style="margin-top:12px" data-mode></div>
  </div>`;
  const $c = (s) => root.querySelector(s);
  const ctx = $c(".ctx"), grid = $c(".ctx-grid"), act = $c(".ctx-act"), roll = $c(".ctx-roll"), sr = $c(".ctx-sr"), of = $c(".ctx-figure .ctx-of"), mode = $c("[data-mode]");

  const paintGrid = () => {
    const owner = OWNERS[compact], was = OWNERS[compact ? 0 : 1];
    grid.dataset.wave = moved ? (compact ? "a" : "b") : "";
    if (!moved) grid.removeAttribute("data-wave");
    /* a dot that changes kind is a new element, so its swap
       animation starts again; the rest keep theirs */
    grid.innerHTML = owner.map((o, i) => {
      const k = o === null ? "" : kinds[o].id;
      const swap = moved && DELAY[i] ? (o === null ? "drain" : "fill") : "";
      const style = DELAY[i] && swap
        ? `transition-delay:${DELAY[i]}ms;animation-delay:${DELAY[i]}ms;--was:${was[i] === null ? "var(--ctx-empty)" : `var(--k-${kinds[was[i]].id})`};--now:${o === null ? "var(--ctx-empty)" : `var(--k-${kinds[o].id})`}`
        : "";
      return `<i class="ctx-dot" data-i="${i}" ${k ? `data-kind="${k}"` : ""} ${swap ? `data-swap="${swap}"` : ""} ${style ? `style="${style}"` : ""}></i>`;
    }).join("");
    paintHot();
  };

  const paintHot = () => {
    const sizes = SIZES[compact];
    const used = sizes.reduce((a, b) => a + b, 0);
    /* the big number rolls toward whatever it is showing */
    const hotKind = hot ? kinds.findIndex((c) => c.id === hot) : -1;
    const target = hotKind >= 0 ? sizes[hotKind] : used;
    /* which way the wheels turn: up for more, down for less */
    if (last !== null && target !== last) up = target > last;
    last = target;
    const txt = unit(target);
    sr.textContent = `${txt} FTE`;
    Roll(roll, txt, up);
    of.textContent = hotKind >= 0 ? `FTE · ${kinds[hotKind].name}` : `dari ${unit(WINDOW)} FTE`;
    ctx.toggleAttribute("data-hot", !!hot);
    const owner = OWNERS[compact];
    grid.querySelectorAll(".ctx-dot").forEach((d, i) => {
      const o = owner[i];
      d.toggleAttribute("data-dim", hot !== null && (o === null || kinds[o].id !== hot));
    });
    root.querySelectorAll(".ctx-chip").forEach((c) => c.toggleAttribute("data-on", hot === c.dataset.k));
  };

  const paintHead = () => {
    /* only what reads at a glance: the name, and the one action */
    act.textContent = compact ? "Alokasi mentah" : "Terapkan bobot";
    act.toggleAttribute("data-quiet", !compact);
    mode.textContent = compact ? "Beban tertimbang: alokasi × bobot fase × faktor peran × kompleksitas × sisa progres" : "Alokasi mentah: jumlah % alokasi tanpa bobot";
  };

  const setHot = (h) => { if (h === hot) return; hot = h; paintHot(); };
  act.addEventListener("click", () => { moved = true; compact = compact ? 0 : 1; paintHead(); paintGrid(); });
  /* leaving the field, not the card, is what puts the total back */
  ctx.addEventListener("pointerleave", () => setHot(null));
  grid.addEventListener("pointerleave", () => setHot(null));
  grid.addEventListener("pointerover", (e) => {
    const d = e.target.closest(".ctx-dot"); if (!d) return;
    const o = OWNERS[compact][+d.dataset.i];
    setHot(o === null ? null : kinds[o].id);
  });
  root.querySelectorAll(".ctx-chip").forEach((c) => {
    c.addEventListener("pointerenter", () => setHot(c.dataset.k));
    c.addEventListener("focus", () => setHot(c.dataset.k));
    c.addEventListener("blur", () => setHot(null));
  });
  root.querySelector(".ctx-chips").addEventListener("pointerleave", () => setHot(null));
  paintHead(); paintGrid();
}

/* ══ Card swap ════════════════════════════════════════════
   A stack of photo cards in depth, each a step further back and up
   to the right, slanted. Press the front card, or drag and fling it,
   and it goes straight to the back while the rest step forward.
   With Auto on it also does that by itself every few seconds,
   pausing while a pointer is on the stack.

   here: the cards are the projects carrying the most load, painted
   in their phase colour instead of photos.

   ── A CARD IS ITS SLOT ──────────────────────────────────
   The order is the only state: which card is in front, which is
   behind it. A slot is a fixed transform, so moving a card is
   changing its slot and letting the transition carry it — the card
   sent back takes the back slot's paint order AT ONCE and travels
   there behind the others. That needs the paint order to be the
   z-index and not the depth, so the stage is flat (no preserve-3d)
   and the perspective sits on the stage itself, aimed at the
   block's middle as it was when it sat on .csw. */
function CardSwap(root, cards, {
  /* off by default: a stack that reshuffles itself on a timer is a
     thing that keeps moving while you are reading the page */
  auto = false,
  /* seconds between swaps, when it is on */
  every = 4,
  onFront = () => {},
} = {}) {
  const W = 360, H = 350, CW = 196, CH = 246, STEP_X = 34, STEP_Y = 26, STEP_Z = 70;
  const slot = (k) => `translate3d(${k * STEP_X}px, ${-k * STEP_Y}px, ${-k * STEP_Z}px) skewY(6deg)`;
  let order = cards.map((c) => c.id);
  const st = { hover: false, drag: null };

  root.innerHTML = `<div class="csw-fit"><div class="csw" style="width:${W}px;height:${H}px"><div class="csw-stage" style="width:${CW}px;height:${CH}px">${cards.map((c) =>
    `<div class="csw-card" data-id="${c.id}"><div class="csw-photo" style="background:${c.bg}">${c.html}</div><div class="csw-tag">${c.title}</div></div>`).join("")}</div></div></div>`;
  const fit = root.querySelector(".csw-fit"), box = root.querySelector(".csw");
  const els = {}; root.querySelectorAll(".csw-card").forEach((el) => (els[el.dataset.id] = el));

  /* here: the block is 360 wide; in a narrower card it scales down
     whole rather than being cropped */
  const resize = () => { const s = Math.min(1, (root.clientWidth || W) / W); box.style.transform = s < 1 ? `scale(${s})` : ""; fit.style.height = H * s + "px"; };
  resize(); new ResizeObserver(resize).observe(root);

  const paint = () => {
    cards.forEach((c, n) => {
      const el = els[c.id], k = order.indexOf(c.id), front = k === 0;
      el.style.zIndex = cards.length - k;
      /* the slot is a variable the stylesheet turns into the
         transform; the drag writes the transform itself, which
         wins until it is cleared */
      el.style.setProperty("--t", slot(k));
      el.toggleAttribute("data-front", front);
      el.tabIndex = front ? 0 : -1;
      el.setAttribute("role", front ? "button" : "presentation");
      if (front) el.setAttribute("aria-label", `${c.title}. Tekan untuk kartu berikutnya.`);
    });
    onFront(order[0]);
  };

  /* send the front card to the back: it takes the back slot now, from
     wherever it is — the front slot, or where a drag left it */
  /* every card goes back to its slot: no drag survives a swap, so a
     card can never be left holding where a hand once put it */
  const settle = () => { for (const el of Object.values(els)) { el.style.transition = ""; el.style.transform = ""; } };
  const swap = () => { settle(); order = [...order.slice(1), order[0]]; paint(); };

  /* ── the drag ────────────────────────────────────────────
     Only the card that was grabbed moves, and the window hears the
     gesture, so it cannot be lost off the edge of the block or picked
     up by a card the pointer passes over. A real press takes over from
     a scripted one. Past a little way the card is on a rubber band, so
     a long drag cannot carry it out of the block. */
  let unhook = () => {};
  const grab = (e, id, front) => {
    const s = st;
    if (s.drag && e.isTrusted && !s.drag.real) { unhook(); s.drag = null; settle(); }
    if (!front || s.drag || e.button !== 0) return;
    const el = e.currentTarget;
    s.drag = { id, real: e.isTrusted, pid: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, t: performance.now() };
    el.style.transition = "none";
    const rub = (d) => 160 * Math.tanh(d / 160);
    const mine = (ev) => !!s.drag && ev.pointerId === s.drag.pid && ev.isTrusted === s.drag.real;
    const mv = (ev) => {
      if (!mine(ev) || !s.drag) return;
      const d = s.drag;
      d.dx = ev.clientX - d.x;
      d.dy = ev.clientY - d.y;
      const x = rub(d.dx), y = rub(d.dy);
      el.style.transform = `${slot(0)} translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(x * 0.05).toFixed(2)}deg)`;
    };
    const up = (ev) => {
      if (!mine(ev) || !s.drag) return;
      const d = s.drag;
      s.drag = null;
      unhook();
      const far = Math.hypot(d.dx, d.dy);
      const quick = far / Math.max(1, performance.now() - d.t) > 0.6;
      /* a press, or a drag far or quick enough: to the back */
      if (ev.type !== "pointercancel" && (far < 6 || far > 70 || (quick && far > 24))) { swap(); return; }
      /* not far enough: it springs back into the front slot */
      settle();
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    unhook = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      unhook = () => {};
    };
  };
  Object.entries(els).forEach(([id, el]) => {
    el.addEventListener("pointerdown", (e) => grab(e, id, order[0] === id));
    /* here: the front card also answers Enter and Space */
    el.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && order[0] === id) { e.preventDefault(); swap(); el.blur(); els[order[0]].focus(); } });
  });
  box.addEventListener("pointerenter", () => { st.hover = true; });
  box.addEventListener("pointerleave", () => { st.hover = false; });

  /* the timer: one swap every few seconds, unless a hand is on it */
  if (auto) {
    const id = window.setInterval(() => {
      if (!root.isConnected) return window.clearInterval(id);
      if (!st.hover && !st.drag && !document.hidden) swap();
    }, Math.max(1.5, every) * 1000);
  }
  paint();
  return { swap };
}

/* ══ Upload dropzone ══════════════════════════════════════
   A drop box. Carry a file into it: it uploads there — name,
   a rolling percentage, a bar — ticks, and the box opens back out.

   here: the files are REAL. Bencho's block carried pretend files
   from a tray; this one takes an Excel workbook dropped from the
   desktop, or picked by tapping the box (the only way on a phone),
   and hands its bytes to the importer when the bar is full.

   ── THE BOX INHALES, AND SWALLOWS ───────────────────────
   A plain filled box, no edge. A file carried over it is
   answered before it is let go: the box grows with a small
   bounce and the arrow lifts toward the hand. Let go and the
   box gives a little gulp before the upload appears in it.

   ── ONE OF THEM IS TOO BIG ──────────────────────────────
   The limit is fixed at 5 MB; a file over it, or one that is not a
   workbook, shakes the box and says so in red. */
function UploadDropzone(root, {
  /* how fast a file sends, 0..100 */
  speed = 70,
  /* how springy the box lands an upload, 0..100 */
  bounce = 40,
  corner = 8,
  accept = /\.(xlsx|xls)$/i,
  onFile = async () => {},
} = {}) {
  const still = stillness();
  const MAX = 5;
  /* what it says the second time, and after */
  const SNARK = [
    "Masih terlalu besar. Ukurannya tidak berubah.",
    "Didorong lebih keras tidak akan membantu",
    "Sudah coba dikompres?",
    "Kotaknya mulai penuh alasan",
    "Tidak.",
  ];
  const fmt = (b) => (b >= 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.round(b / 1e3)} KB`);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const UpIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>`;
  const Check = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;

  /* ── the file icon ─────────────────────────────────────────
     After Untitled UI's: a rounded page on a 40 grid with a thin
     grey outline and a folded corner, and the extension on a
     coloured label that sticks out past the page's left edge —
     the colour carries the kind before the word is read. */
  const Page = (ext, tint, size = 40) => `<svg class="upl-page" width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" aria-hidden="true">
    <path class="upl-page-line" d="M7.75 4A3.25 3.25 0 0 1 11 .75h16c.121 0 .238.048.323.134l10.793 10.793a.46.46 0 0 1 .134.323v24A3.25 3.25 0 0 1 35 39.25H11A3.25 3.25 0 0 1 7.75 36z"/>
    <path class="upl-page-line" d="M27 .5V8a4 4 0 0 0 4 4h7.5"/>
    <rect width="29" height="16" x="1" y="18" rx="8" fill="${tint}"/>
    <text x="15.5" y="29.1" text-anchor="middle" font-size="9" class="upl-page-ext">${ext}</text></svg>`;
    /* 9 units on the 40 grid: the mark is part of the drawing and
       scales with it, so its size lives here, not in the stylesheet */

  const Roll = (value) => {
    const s = String(Math.round(value));
    return `<span class="upl-roll" aria-label="${s}%">${s.split("").map((d) =>
      `<span class="upl-roll-col"><span class="upl-roll-strip" style="transform:translateY(${-Number(d)}em)">${"0123456789".split("").map((n) => `<span>${n}</span>`).join("")}</span></span>`).join("")}%</span>`;
  };

  root.innerHTML = `<div class="upl" style="--upl-r:${Math.max(0, corner)}px;--upl-spring:cubic-bezier(0.3, ${1 + (bounce / 100) * 0.9}, 0.4, 1)">
    <div class="upl-zone-wrap"><div class="upl-zone" role="button" tabindex="0" aria-live="polite" aria-label="Impor workbook Excel. Tarik file ke sini atau tekan untuk memilih."></div></div>
    <input type="file" accept=".xlsx,.xls" hidden></div>`;
  const wrap = root.querySelector(".upl-zone-wrap"), zone = root.querySelector(".upl-zone"), input = root.querySelector("input");

  let phase = { kind: "idle" }, over = false, refuse = null, tries = 0, cool = 0, raf = 0, depth = 0;
  const timers = [];
  const later = (fn, ms) => timers.push(window.setTimeout(fn, ms));

  const paint = () => {
    zone.toggleAttribute("data-over", over);
    zone.toggleAttribute("data-refuse", !!refuse);
    zone.toggleAttribute("data-busy", phase.kind !== "idle");
    if (phase.kind === "idle") {
      zone.innerHTML = `<span class="upl-icon">${UpIcon}</span><span class="upl-say"><b>${refuse ?? (over ? "Lepas untuk impor" : "Tarik workbook ke sini")}</b><span>.xlsx hingga ${MAX} MB · atau tekan untuk memilih</span></span>`;
      zone.style.width = ""; zone.style.height = "";
      return;
    }
    const f = phase.f;
    const p = phase.kind === "up" ? phase.p : 1;
    let now = zone.querySelector(".upl-now");
    if (!now) {
      zone.innerHTML = `<span class="upl-now">${Page(f.name.split(".").pop().toUpperCase(), "#079455", 36)}<span class="upl-text"><span class="upl-name"></span><span class="upl-meta"></span><span class="upl-track"><span class="upl-bar"></span></span></span><span class="upl-end"></span></span>`;
      now = zone.querySelector(".upl-now");
      now.querySelector(".upl-name").textContent = f.name;
      /* ── the box hugs the upload ─────────────────────────────
         While a file is in it the box closes in round the upload
         row — measured, because the row is as wide as its name — and
         back to idle it opens out to the full drop box again. Width
         and height, never a scale, so its corner stays the corner. It
         shrinks inside a slot of fixed size, so nothing below it moves. */
      zone.style.width = `${now.offsetWidth + 32}px`;
      zone.style.height = `${now.offsetHeight + 28}px`;
    }
    const meta = now.querySelector(".upl-meta");
    if (phase.kind === "done") meta.textContent = `${fmt(f.size)} · ${phase.msg || "Terimpor"}`;
    else {
      /* here: the wheels are kept between frames, so each strip's
         transition carries it to the next digit rather than jumping */
      if (!meta.querySelector(".upl-r")) meta.innerHTML = `${fmt(f.size)} · <span class="upl-r"></span>`;
      const r = meta.querySelector(".upl-r"), s = String(Math.round(p * 100)), cols = r.querySelectorAll(".upl-roll-col");
      if (cols.length !== s.length) r.innerHTML = Roll(p * 100);
      else s.split("").forEach((d, i) => { cols[i].firstElementChild.style.transform = `translateY(${-Number(d)}em)`; });
    }
    now.querySelector(".upl-bar").style.transform = `scaleX(${p})`;
    /* the tick's room is kept from the start, so the box
       is its final size before the tick arrives */
    if (phase.kind === "done" && !now.querySelector(".upl-tick")) now.querySelector(".upl-end").innerHTML = `<span class="upl-tick">${Check}</span>`;
  };

  /* ── trying again ─────────────────────────────────────────
     The first refusal is plain. Try the same file again and the
     box starts to answer back, a new line each time, the last one
     repeating — until a file that fits goes through, which puts it
     back to being polite. */
  const refuseIt = (first) => {
    const n = tries++;
    refuse = n === 0 ? first : SNARK[Math.min(n - 1, SNARK.length - 1)];
    paint();
    if (!still) wrap.animate([{ transform: "translateX(0)" }, { transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-4px)" }, { transform: "translateX(2px)" }, { transform: "translateX(0)" }], { duration: 420 });
    later(() => { refuse = null; paint(); }, 1800);
    /* "in a row" means close together: leave it alone a while and
       the next refusal is the polite one again */
    clearTimeout(cool);
    cool = window.setTimeout(() => { tries = 0; }, 8000);
  };

  /* ── the wire ────────────────────────────────────────────
     here: the bytes are read at once; the bar runs its own uneven
     climb so the arrival is seen, and the importer runs when it is full */
  const send = (f) => {
    const bytes = f.arrayBuffer();
    const finish = async () => {
      try {
        const msg = await onFile(await bytes, f);
        tries = 0;
        phase = { kind: "done", f, msg }; paint();
        /* the box opens back out, ready to go again */
        later(() => { phase = { kind: "idle" }; paint(); }, 1500);
      } catch (err) {
        phase = { kind: "idle" }; paint();
        refuseIt(err && err.message ? err.message : "Workbook tidak bisa dibaca");
      }
    };
    if (still) { finish(); return; }
    phase = { kind: "up", f, p: 0 }; paint();
    let p = 0, prev = 0;
    const secs = (4 - (clamp(speed, 0, 100) / 100) * 3.2) * (0.7 + Math.min(1, f.size / 5e6) * 0.6);
    const tick = (t) => {
      const dt = prev ? Math.min(0.05, (t - prev) / 1000) : 0;
      prev = t;
      /* uneven on purpose: a steady climb reads as a timer */
      p = Math.min(1, p + (dt / secs) * (0.4 + Math.random() * 1.2));
      if (p >= 1) { raf = 0; phase = { kind: "up", f, p: 1 }; paint(); finish(); return; }
      phase = { kind: "up", f, p }; paint();
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };

  const take = (f) => {
    if (!f || phase.kind !== "idle") return;
    if (!accept.test(f.name)) return refuseIt("Hanya file .xlsx atau .xls");
    if (f.size > MAX * 1e6) return refuseIt(`Terlalu besar, maksimal ${MAX} MB`);
    /* the gulp: the box takes the file in before the upload appears */
    if (!still) { zone.setAttribute("data-gulp", ""); later(() => zone.removeAttribute("data-gulp"), 460); }
    later(() => send(f), still ? 0 : 220);
  };

  zone.addEventListener("dragenter", (e) => { e.preventDefault(); depth++; if (phase.kind === "idle" && !over) { over = true; paint(); } });
  zone.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  zone.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; over = false; paint(); } });
  zone.addEventListener("drop", (e) => { e.preventDefault(); depth = 0; over = false; paint(); take(e.dataTransfer.files[0]); });
  zone.addEventListener("click", () => { if (phase.kind === "idle") input.click(); });
  zone.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && phase.kind === "idle") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", () => { take(input.files[0]); input.value = ""; });
  paint();
}
