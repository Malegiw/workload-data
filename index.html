<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" data-k>
<meta name="viewport" content="width=device-width, initial-scale=1" data-k>
<title data-k>Workload by YMD</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" data-k></script>
<style data-k>
:root{
  --background:#F5F5F5;--surface:#FFFFFF;--surface-2:#FAFAFA;--surface-3:#F0F0F0;
  --foreground:#242424;--text-secondary:#616161;--text-tertiary:#8A8A8A;--border:#E0E0E0;--border-strong:#D1D1D1;
  --accent:#0F6CBD;--accent-hover:#115EA3;--accent-soft:#EBF3FC;--on-accent:#fff;
  --success:#107C10;--success-soft:#F1FAF1;--warning:#BC4B09;--warning-soft:#FFF9F5;--danger:#C50F1F;--danger-soft:#FDF3F4;
  --shadow-2:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);
  --shadow-4:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);
  --shadow-16:0 0 2px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.14);
  --shadow-28:0 0 8px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.14);
  --r:8px;--r-sm:4px;
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.33,0,.1,1);--snappy:cubic-bezier(.2,.9,.3,1.2);
}
[data-theme="dark"]{
  --background:#1F1F1F;--surface:#292929;--surface-2:#2E2E2E;--surface-3:#383838;
  --foreground:#FFFFFF;--text-secondary:#ADADAD;--text-tertiary:#8A8A8A;--border:#3D3D3D;--border-strong:#525252;
  --accent:#479EF5;--accent-hover:#62ABF5;--accent-soft:#0E2A47;--on-accent:#0A0A0A;
  --success:#54B054;--success-soft:#0F2A0F;--warning:#F7894A;--warning-soft:#3A1E0E;--danger:#F1707B;--danger-soft:#3B1418;
  --shadow-4:0 0 2px rgba(0,0,0,.24),0 2px 4px rgba(0,0,0,.28);
  --shadow-16:0 0 2px rgba(0,0,0,.24),0 8px 16px rgba(0,0,0,.28);
  --shadow-28:0 0 8px rgba(0,0,0,.24),0 14px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased;transition:background .25s var(--ease),color .25s var(--ease)}
button,input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:48px 1fr;height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--accent);color:#fff}
[data-theme="dark"] .topbar{background:#0C3B5E}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand small{font-weight:400;opacity:.8}
.search-btn{flex:1;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:var(--r-sm);background:rgba(255,255,255,.92);color:#616161;cursor:pointer;text-align:left}
[data-theme="dark"] .search-btn{background:#292929;color:#ADADAD}
.search-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-btn kbd{margin-left:auto;font-family:inherit;font-size:11px;padding:0 6px;border:1px solid #D1D1D1;border-radius:4px;color:#8A8A8A}
.top-actions{display:flex;align-items:center;gap:8px}
.save-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;transition:background .15s}
.save-btn:hover{background:rgba(255,255,255,.12)}
.save-btn.dirty{background:#fff;color:#0F6CBD;border-color:#fff}
.save-btn .dot{width:8px;height:8px;border-radius:50%;background:#C50F1F;display:none}
.save-btn.dirty .dot{display:block;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.4);opacity:.6}}
/* liquid toggle */
.ltoggle{position:relative;width:52px;height:28px;border-radius:14px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);cursor:pointer;padding:0;overflow:hidden}
.ltoggle .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .45s var(--snappy),width .25s var(--ease);display:grid;place-items:center;color:#0F6CBD}
.ltoggle:active .knob{width:28px}
[data-theme="dark"] .ltoggle .knob{left:27px;background:#479EF5;color:#0A0A0A}
[data-theme="dark"] .ltoggle:active .knob{left:19px}
.nav{background:var(--surface);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:var(--r-sm);color:var(--foreground);text-decoration:none;transition:background .12s}
.nav a:hover{background:var(--surface-3)}
.nav a.on{background:var(--accent-soft);font-weight:600;color:var(--accent)}
.nav a.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent);animation:grow .3s var(--snappy)}
@keyframes grow{from{transform:scaleY(0)}}
.nav svg{width:20px;height:20px;flex:none}
.nav .sn{display:none}
.nav .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--text-tertiary);line-height:16px}
main{overflow:auto;padding:24px 28px 40px;min-width:0}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:24px;line-height:32px;font-weight:600;margin:0}
.page-head p{margin:2px 0 0;color:var(--text-secondary)}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-4);padding:16px;min-width:0;animation:rise .4s var(--ease) both}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.card h2{font-size:16px;line-height:22px;font-weight:600;margin:0}
.card .sub{color:var(--text-secondary);font-size:12px;margin-top:2px}
.card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.card-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.mt{margin-top:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:600;transition:background .12s,transform .12s var(--snappy);white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.subtle{border-color:transparent;background:transparent}
.btn.subtle:hover{background:var(--surface-3)}
.btn.danger{color:var(--danger)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn svg{width:16px;height:16px}
.icon-btn{width:32px;padding:0}
/* segmented / jelly tabs */
.seg{position:relative;display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:2px;gap:2px;flex-wrap:nowrap;overflow:auto;max-width:100%}
.seg button{position:relative;z-index:1;border:0;background:transparent;height:28px;padding:0 10px;border-radius:3px;cursor:pointer;color:var(--text-secondary);white-space:nowrap;font-size:13px}
.seg button.on{color:var(--foreground);font-weight:600}
.seg .pill{position:absolute;z-index:0;top:2px;height:28px;border-radius:3px;background:var(--surface);box-shadow:var(--shadow-2);transition:left .4s var(--snappy),width .4s var(--snappy)}
/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lab{color:var(--text-secondary);font-size:13px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:32px;line-height:40px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:16px;font-weight:400;color:var(--text-secondary)}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:32px}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-avail{background:var(--accent-soft);color:var(--accent)}
.b-opt{background:var(--success-soft);color:var(--success)}
.b-over{background:var(--danger-soft);color:var(--danger)}
.b-neutral{background:var(--surface-3);color:var(--text-secondary)}
/* donut */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:190px;height:190px;flex:none}
.donut path{transition:opacity .15s,transform .2s var(--ease);transform-origin:100px 100px;cursor:pointer}
.donut path:hover{transform:scale(1.04)}
.donut .d-num{font-size:30px;font-weight:600;fill:var(--foreground);font-variant-numeric:tabular-nums}
.donut .d-lab{font-size:11px;fill:var(--text-secondary)}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .sw{width:10px;height:10px;border-radius:2px;flex:none}
.legend .li b{margin-left:auto;font-variant-numeric:tabular-nums}
/* bar chart */
.bc{display:flex;flex-direction:column;gap:6px}
.bc-plot{position:relative;height:220px;display:flex;align-items:flex-end;gap:10px;padding-left:34px;border-bottom:1px solid var(--border)}
.bc-mark{position:absolute;left:34px;right:0;border-top:1px dashed var(--border-strong)}
.bc-mark span{position:absolute;left:-34px;top:-9px;font-size:11px;color:var(--text-tertiary)}
.bc-mark.hi{border-top-color:var(--danger)}
.bc-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;border-radius:4px 4px 0 0;transition:background .12s}
.bc-col:hover,.bc-col.act{background:var(--surface-3)}
.bc-bar{width:70%;max-width:44px;border-radius:4px 4px 0 0;transition:height .8s var(--snappy);position:relative}
.bc-bar em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.bc-x{display:flex;gap:10px;padding-left:34px}
.bc-x span{flex:1;text-align:center;font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* heatmap */
.hm{display:grid;gap:3px;font-size:12px;min-width:640px}
.hm-wrap{overflow:auto}
.hm .hn{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;padding-right:8px}
.hm .hh{font-size:11px;color:var(--text-secondary);text-align:center}
.hm .hc{height:26px;border-radius:3px;transition:transform .15s var(--snappy),box-shadow .15s;display:grid;place-items:center;font-size:10px;font-weight:600;color:transparent;cursor:default}
.hm .hc:hover{transform:scale(1.18);box-shadow:var(--shadow-16);z-index:2;position:relative;color:var(--foreground)}
.hm-scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}
.hm-scale i{width:18px;height:10px;border-radius:2px;display:block}
/* stacked bars */
.sb{display:flex;flex-direction:column;gap:10px}
.sb-row{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:10px;font-size:13px}
.sb-track{position:relative;height:22px;background:var(--surface-3);border-radius:4px;overflow:hidden;display:flex}
.sb-seg{height:100%;width:0;transition:width .9s var(--snappy);cursor:pointer}
.sb-seg:hover{filter:brightness(1.12)}
.sb-100{position:absolute;top:0;bottom:0;border-left:2px dashed var(--danger);opacity:.7}
.sb-row b{text-align:right;font-variant-numeric:tabular-nums}
/* waffle */
.waffle{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:260px;aspect-ratio:1}
.waffle i{border-radius:3px;background:var(--surface-3);transition:background-color .5s var(--ease),transform .5s var(--snappy)}
/* line chart */
.lc{position:relative}
.lc svg{width:100%;height:auto;display:block;overflow:visible}
.lc .grid-l{stroke:var(--border);stroke-width:1}
.lc .ax{font-size:10px;fill:var(--text-tertiary)}
.lc path.s{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s}
.lc .xh{stroke:var(--text-tertiary);stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.lc-leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lc-leg button{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:12px;height:24px;padding:0 10px;font-size:12px;cursor:pointer;transition:opacity .2s}
.lc-leg button.off{opacity:.4}
.lc-leg i{width:8px;height:8px;border-radius:50%}
/* tables */
.tw{overflow:auto;border-radius:var(--r-sm)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
.t th.s{cursor:pointer}
.t th.s:hover{color:var(--foreground)}
.t th .ar{display:inline-block;margin-left:4px;transition:transform .25s var(--snappy);opacity:.35}
.t th.sorted .ar{opacity:1}
.t th.desc .ar{transform:rotate(180deg)}
.t td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr{transition:background .1s}
.t tbody tr:hover{background:var(--surface-2)}
.t tr.click{cursor:pointer}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.t tr.enter{animation:rowin .35s var(--ease) both}
@keyframes rowin{from{opacity:0;transform:translateY(-4px)}}
.muted{color:var(--text-secondary)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--text-secondary)}
/* phase pill & status picker */
.phase{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s var(--snappy)}
.phase:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}
.phase i{width:8px;height:8px;border-radius:50%}
.popover{position:fixed;z-index:60;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-16);padding:4px;min-width:180px;animation:pop .2s var(--snappy);transform-origin:top left}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.popover button{display:flex;align-items:center;gap:8px;width:100%;height:32px;border:0;background:transparent;padding:0 10px;border-radius:4px;cursor:pointer;text-align:left}
.popover button:hover{background:var(--surface-3)}
.popover button i{width:8px;height:8px;border-radius:50%}
.popover button .ck{margin-left:auto;color:var(--accent)}
/* progress bar */
.pbar{position:relative;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:70px}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent);transition:width .8s var(--snappy)}
.pcell{display:flex;align-items:center;gap:8px}
.pcell span{font-size:12px;font-variant-numeric:tabular-nums;width:32px;text-align:right}
/* avatars */
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:600;color:#fff;flex:none;border:2px solid var(--surface)}
.av.lg{width:44px;height:44px;font-size:15px}
.avg{display:flex;align-items:center}
.avg .av{margin-left:-8px;transition:transform .2s var(--snappy),margin .2s var(--snappy)}
.avg .av:first-child{margin-left:0}
.avg:hover .av{margin-left:-2px}
.avg .av:hover{transform:translateY(-3px) scale(1.08);z-index:2}
.avg .more{background:var(--surface-3);color:var(--text-secondary)}
/* hover card */
.hcard{position:fixed;z-index:70;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-16);padding:12px;width:240px;pointer-events:none;animation:pop .18s var(--snappy)}
.hcard .top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hcard b{display:block}
/* tooltip */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--foreground);color:var(--surface);font-size:12px;line-height:16px;padding:6px 8px;border-radius:4px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;white-space:pre-line}
#tip.on{opacity:1;transform:none}
/* person cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{cursor:pointer;transition:transform .2s var(--snappy),box-shadow .2s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-16)}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard .nm{font-weight:600;line-height:18px}
.pcard .rl{font-size:12px;color:var(--text-secondary)}
.ring{width:64px;height:64px;margin-left:auto;flex:none;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface-3)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1s var(--snappy),stroke .3s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:var(--surface-3);font-size:11px}
.chip i{width:6px;height:6px;border-radius:50%}
.spark{width:100%;height:36px;display:block;margin-top:10px}
.spark path.l{fill:none;stroke-width:1.6}
/* tree */
.tree .lvl0 td{font-weight:600;background:var(--surface-2)}
.tree .tg{display:inline-grid;place-items:center;width:20px;height:20px;border:0;background:transparent;border-radius:3px;cursor:pointer;color:var(--text-secondary);transition:transform .2s var(--snappy)}
.tree .tg.open{transform:rotate(90deg)}
.tree .tg:hover{background:var(--surface-3)}
.tree .ind1{padding-left:30px}.tree .ind2{padding-left:58px}
.meter{display:flex;align-items:center;gap:8px}
.meter .pbar{flex:1;max-width:140px}
/* forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--text-secondary)}
.in{height:32px;padding:0 10px;border:1px solid var(--border-strong);border-bottom-color:var(--text-secondary);border-radius:var(--r-sm);background:var(--surface);width:100%;transition:border-color .15s}
.in:focus{border-bottom:2px solid var(--accent)}
.in.err{border-color:var(--danger);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* range slider */
.range{display:flex;align-items:center;gap:12px}
.range input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--border-strong) var(--p,50%));cursor:pointer}
.range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--surface);border:5px solid var(--accent);box-shadow:var(--shadow-2);transition:transform .15s var(--snappy)}
.range input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
.range input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--surface);border:5px solid var(--accent)}
.range output{min-width:46px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rf{width:64px;height:28px;text-align:right;padding:0 6px}
/* progress tracker */
.track{display:flex;align-items:center;margin:8px 0 18px}
.track .st{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:70px;font-size:12px;color:var(--text-secondary)}
.track .st b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border-strong);background:var(--surface);font-size:12px;transition:all .4s var(--snappy)}
.track .st.done b{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.track .st.cur b{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* overlay / dialog */

/* command bar */
.cmd{max-width:560px;padding:0;align-self:flex-start;margin-top:12vh}

/* toasts */
.toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:260px;max-width:360px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-16);padding:12px 14px;border-left:4px solid var(--accent);animation:tin .35s var(--snappy)}
.toast.ok{border-left-color:var(--success)}.toast.warn{border-left-color:var(--warning)}.toast.err{border-left-color:var(--danger)}

.warnbox{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--danger-soft);color:var(--danger);font-size:13px;margin-top:8px;animation:rise .25s}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-12,.g2,.g3{grid-template-columns:1fr}}

  .nav a{flex:1;flex-direction:column;justify-content:center;height:52px;gap:2px;padding:0;font-size:10px}
  .nav a.on::before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:3px}
  .nav .foot{display:none}.nav .ln{display:none}.nav .sn{display:block}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ══ Bencho components (MIT, bencho.dev/licence) ═══════════
   Their design tokens are mapped onto this app's own Fluent tokens
   on each component's root, so nothing new is defined globally:
   ink → --foreground, slab/card → --surface, signal → --accent,
   ok → --success, UI font → --font, pane edge → --border. */
.ctx,.csw,.upl,.ptc{
  --fill-on:var(--foreground);--ink:var(--foreground);
  --fill-slab:var(--surface);--card:var(--surface);
  --signal:var(--accent);--ok:var(--success);
  --font-ui:var(--font);--pane-edge:var(--border);
}
/* the drop box is a filled box with no edge: on this app's white
   cards that fill has to be the next surface down, or it vanishes */
.upl{--fill-slab:var(--surface-3)}
/* the logo sits on the brand bar, so its ink is the bar's white */
.brand .ptc{--fill-on:#fff;--ink:#fff}

/* ══ Context meter ════════════════════════════════════════
   lab/ContextMeter.tsx. A slab card: a head, a rolling figure, a
   field of dots filled column by column, chips for the kinds, and a
   foot with the room left and Compact. Each kind is a strength of
   the ink, strongest first; the empty room is a faint wash */
.ctx {
  --ctx-empty: color-mix(in srgb, var(--fill-on, #17181a) 8%, var(--fill-slab, #fff));
  /* here the kinds are the four phases, in the app's own phase hues */
  --k-ded: #0F6CBD;
  --k-feed: #8764B8;
  --k-pre: #00A5AF;
  --k-ini: #D29200;
  /* 20 dots of 11 on a 3px gap, plus the padding */
  width: 309px;
  box-sizing: border-box;
  padding: 16px;
  border-radius: 20px;
  background: var(--fill-slab, var(--card, #fff));
  color: var(--fill-on, var(--ink, #17181a));
  font-family: var(--font-ui);
  user-select: none;
  -webkit-user-select: none;}
.ctx-head { display: flex; justify-content: space-between; align-items: center; }
.ctx-title { font-size: 16px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em; }
.ctx-figure { display: flex; align-items: baseline; gap: 6px; margin: 12px 0 16px; }
.ctx-num { position: relative; font-size: 30px; line-height: 32px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
/* the odometer: each digit a wheel, a window one line tall */
.ctx-roll { display: flex; line-height: 1; }
.ctx-wheel { position: relative; display: inline-block; height: 1.15em; overflow: hidden; }
.ctx-digit { display: block; line-height: 1.15em; }
.ctx-sym { line-height: 1.15em; }
/* the figure in words, for anyone not watching it roll */
.ctx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ctx-of { font-size: 13px; color: color-mix(in srgb, var(--fill-on, #17181a) 52%, var(--fill-slab, #fff)); }
/* the field: filled down each column, then across */
.ctx-grid {
  display: grid;
  grid-auto-flow: column;
  justify-content: center;}
.ctx-dot {
  display: block;
  border-radius: 2px;
  background: var(--ctx-empty);
  transition: background-color 260ms ease, opacity 220ms ease, scale 260ms cubic-bezier(0.22, 1, 0.36, 1);}
/* a dot changing kind never blends two colours: one solid colour grows
   over the other, from nothing to the full dot. Filling, the new colour
   grows in over the old; draining, the old colour shrinks away and leaves
   the empty dot behind it */
.ctx-dot[data-swap] { position: relative; }
.ctx-dot[data-swap]::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  /* short, so the whole swap is done by the sound's knock */
  animation: 340ms cubic-bezier(0.34, 1.2, 0.64, 1) both;
  animation-delay: inherit;}
.ctx .ctx-dot[data-swap="fill"] { background: var(--was); }
.ctx-dot[data-swap="fill"]::after { background: var(--now); animation-name: ctx-grow; }
.ctx-dot[data-swap="drain"]::after { background: var(--was); animation-name: ctx-shrink; animation-timing-function: cubic-bezier(0.55, 0, 0.75, 0.4); animation-duration: 240ms; }
/* the field gives under the press, the bar's squeeze in both axes:
   down to its floor at 38% of 760, on the sound's knock, a touch past
   on the way back. a/b flips per press so the keyframes restart */
.ctx-grid[data-wave="a"] { animation: ctx-press-a 760ms cubic-bezier(0.33, 0, 0.2, 1) both; }
.ctx-grid[data-wave="b"] { animation: ctx-press-b 760ms cubic-bezier(0.33, 0, 0.2, 1) both; }
.ctx-dot[data-kind="ded"],.ctx-swatch[data-kind="ded"] { background: var(--k-ded); }
.ctx-dot[data-kind="feed"],.ctx-swatch[data-kind="feed"] { background: var(--k-feed); }
.ctx-dot[data-kind="pre"],.ctx-swatch[data-kind="pre"] { background: var(--k-pre); }
.ctx-dot[data-kind="ini"],.ctx-swatch[data-kind="ini"] { background: var(--k-ini); }
/* pointing at a kind: it holds, the rest fall back */
/* only the fade: growing the lit dots ate into the 3px gaps and the
   grid stopped being an even grid */
.ctx-dot[data-dim] { opacity: 0.22; }
.ctx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.ctx-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--fill-on, #17181a) 6%, var(--fill-slab, #fff));
  color: var(--fill-on, #17181a);
  font: inherit;
  font-size: 13px;
  cursor: default;
  transition: background-color 160ms ease, scale 260ms cubic-bezier(0.34, 1.56, 0.64, 1);}
/* the chip gives a little under the pointer; keyed to data-on rather than
   :hover, so hovering a kind in the field presses its chip too */
.ctx-chip[data-on] { background: color-mix(in srgb, var(--fill-on, #17181a) 12%, var(--fill-slab, #fff)); scale: 0.975; }
.ctx-chip:focus-visible { outline: 2px solid var(--signal, #2231dd); outline-offset: 1px; }
.ctx-swatch { display: block; width: 8px; height: 8px; border-radius: 2px; }
.ctx-act {
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  /* on a light card a solid black pill shouts over the meter it acts
     on: a firm grey wash with ink words instead. A dark card keeps
     the solid pill, where white on near-black reads calm */
  background: color-mix(in srgb, var(--fill-on, #17181a) 10%, var(--fill-slab, #fff));
  color: var(--fill-on, #17181a);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: scale 240ms cubic-bezier(0.22, 1, 0.36, 1), background-color 220ms ease, color 220ms ease;}
/* Undo is the way back, not the action: quieter than Compact in either
   fill — a fainter wash, and on a light card muted words */
.ctx-act[data-quiet] {
  background: color-mix(in srgb, var(--fill-on, #17181a) 5%, var(--fill-slab, #fff));
  color: color-mix(in srgb, var(--fill-on, #17181a) 64%, var(--fill-slab, #fff));}
.ctx-act:active { scale: 0.96; }
.ctx-act:focus-visible { outline: 2px solid var(--signal, #2231dd); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .ctx-dot { transition-duration: 1ms; transition-delay: 0ms !important; }
  .ctx-grid[data-wave] { animation: none; }
}
@keyframes ctx-grow { from { scale: 0; } to { scale: 1; } }
@keyframes ctx-press-a { 0%, 100% { scale: 1; } 38% { scale: 0.965; } 72% { scale: 1.01; } }
@keyframes ctx-press-b { 0%, 100% { scale: 1; } 38% { scale: 0.965; } 72% { scale: 1.01; } }
@keyframes ctx-shrink { from { scale: 1; } to { scale: 0; } }

/* ══ Card swap ════════════════════════════════════════════
   lab/CardSwap.tsx. A stack in depth; each card's slot arrives as
   --t. Cards are the slab, a title row and a photo with a concentric
   corner. No shadows: depth is the stack and a hairline edge */
.csw-fit { position: relative; overflow: visible; }
.csw {
  /* here: out of the flow, so a scaled-down stack takes no more
     room than it shows */
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: left top;
  user-select: none;
  -webkit-user-select: none;}
.csw-stage {
  position: absolute;
  left: 30px;
  bottom: 24px;
  /* flat, so paint order is the z-index: a card sent back goes behind
     at once. The origin is the block's middle, where it was on .csw */
  perspective: 1000px;
  perspective-origin: 150px 95px;}
/* a card is a photo in a thin slab frame, its corner concentric
   with the photo's, and a solid label pill in the corner */
.csw-card {
  position: absolute;
  inset: 0;
  padding: 3px;
  border-radius: 20px;
  background: var(--fill-slab, #fff);
  color: var(--fill-on, #17181a);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--fill-on, #17181a) 12%, transparent);
  transform: var(--t);
  transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
  backface-visibility: hidden;}
.csw-card[data-front] { cursor: grab; touch-action: none; }
.csw-card[data-front]:active { cursor: grabbing; }
/* no photos here: the "photo" is the project, painted in its phase hue */
.csw-photo {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  height: 100%;
  padding: 16px 16px 56px;
  box-sizing: border-box;
  border-radius: 17px;
  color: #fff;
  pointer-events: none;}
.csw-photo .k { font: 12px/16px ui-monospace, Consolas, monospace; opacity: .85; }
.csw-photo .n { font-size: 17px; line-height: 22px; font-weight: 600; }
.csw-photo .f { font-size: 12px; opacity: .85; }
.csw-photo .big { margin-top: auto; font-size: 28px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
.csw-photo .big small { font-size: 12px; font-weight: 400; opacity: .85; margin-left: 4px; }
.csw-photo .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.csw-photo .bar i { display: block; height: 100%; background: #fff; border-radius: 2px; }
.csw-tag {
  position: absolute;
  left: 14px;
  bottom: 14px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--fill-slab, #fff);
  font-size: 13px;
  font-weight: 600;
  pointer-events: none;}
.csw-info { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.csw-info .muted { font-size: 12px; }

/* ══ Upload dropzone ═════════════════════════════════════ */
.upl {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 300px;
  max-width: 100%;
  font-family: var(--font-ui);
  color: var(--fill-on, var(--ink));
  user-select: none;
  -webkit-user-select: none;}
/* a slot of fixed size, so the box can close in round an upload
   without moving anything below it */
.upl-zone-wrap {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 176px;}
.upl-zone {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  /* 176, up from 128: the drop target is the block, and a short
     one read as a banner rather than a place to put something */
  height: 176px;
  padding: 0 16px;
  box-sizing: border-box;
  overflow: hidden;
  cursor: pointer;
  border-radius: var(--upl-r);
  background: var(--fill-slab, var(--card));
  /* a file over it and it grows, with a bounce; an upload and it
     closes in round it */
  transition:
    scale 420ms cubic-bezier(0.24, 1.34, 0.38, 1),
    width 420ms cubic-bezier(0.24, 1.34, 0.38, 1),
    height 420ms cubic-bezier(0.24, 1.34, 0.38, 1),
    background-color 220ms ease;}
.upl-zone[data-over] { scale: 1.02; }
.upl-zone:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
/* the gulp: in a little as the file goes down, out past its size,
   and settle */
.upl-zone[data-gulp] { animation: upl-gulp 460ms cubic-bezier(0.3, 1.2, 0.4, 1); }
.upl-zone[data-gulp] .upl-icon { animation: upl-open 460ms cubic-bezier(0.3, 1.4, 0.4, 1); }
.upl-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  /* a light grey tile, no edge — the fill's own ink walked most
     of the way to its slab, so it is a pale grey on the light fill
     and a lifted grey on the dark one */
  background: color-mix(in srgb, var(--fill-on, #17181a) 6%, var(--fill-slab, #ffffff));
  color: color-mix(in srgb, var(--fill-on, #17181a) 72%, var(--fill-slab, #ffffff));
  transition: translate 420ms cubic-bezier(0.24, 1.34, 0.38, 1), background-color 220ms ease, color 220ms ease;}
/* over the box the tile only lifts, and its arrow goes to full
   ink — no colour of its own */
.upl-zone[data-over] .upl-icon {
  translate: 0 -4px;
  color: var(--fill-on, var(--ink));}
.upl-say {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  text-align: center;
  letter-spacing: 0em;}
.upl-say b { font-weight: 600; }
.upl-say span {
  font-size: 12px;
  color: color-mix(in srgb, var(--fill-on, #17181a) 52%, var(--fill-slab, #ffffff));
  letter-spacing: 0em;}
.upl-zone[data-refuse] .upl-say b { color: var(--danger); }
/* the file, arrived in the box */
.upl-now {
  display: flex;
  align-items: center;
  gap: 12px;
  width: max-content;
  flex: none;
  animation: upl-land 420ms var(--upl-spring) both;}
.upl-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 150px;}
.upl-name {
  overflow: hidden;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
  letter-spacing: 0em;}
.upl-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 14px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: color-mix(in srgb, var(--fill-on, #17181a) 52%, var(--fill-slab, #ffffff));
  letter-spacing: 0em;}
.upl-track {
  position: relative;
  height: 4px;
  margin-top: 4px;
  overflow: hidden;
  border-radius: 2px;
  background: color-mix(in srgb, var(--fill-on, #17181a) 6%, var(--fill-slab, #ffffff));}
.upl-bar {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--signal, #2231dd);
  transform-origin: left center;}
.upl-roll { display: inline-flex; line-height: 1em; height: 1em; overflow: hidden; }
.upl-roll-col { display: inline-block; height: 1em; overflow: hidden; }
.upl-roll-strip {
  display: flex;
  flex-direction: column;
  transition: transform 220ms cubic-bezier(0.24, 1.34, 0.38, 1);}
.upl-roll-strip > span { height: 1em; line-height: 1em; }
.upl-end {
  display: grid;
  place-items: center;
  flex: none;
  width: 22px;
  height: 22px;}
.upl-tick {
  display: grid;
  place-items: center;
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--ok, #15803d);
  color: #fff;
  animation: upl-pop 380ms cubic-bezier(0.3, 1.6, 0.4, 1) both;}
.upl-page { overflow: visible; }
.upl-page-line {
  stroke: color-mix(in srgb, var(--fill-on, #17181a) 32%, var(--fill-slab, #ffffff));
  stroke-width: 1.5;
  /* outline only: the page is drawn, not filled */
  fill: none;}
.upl-page-ext {
  fill: #fff;
  font-family: var(--font-ui);
  /* size is the <text>'s own fontSize, in the icon's units */
  font-weight: 600;
  letter-spacing: 0em;}
@keyframes upl-gulp {
  0% { scale: 1.02; }
  35% { scale: 0.985; }
  70% { scale: 1.006; }
  100% { scale: 1; }}
@keyframes upl-open { 40% { scale: 1.08; } }
@keyframes upl-land { from { opacity: 0; scale: 0.85; translate: 0 10px; } }
@keyframes upl-pop { from { scale: 0; } }

/* ══ Particles ═════════════════════════════════════════════
   lab/Particles.tsx. The dots are drawn on a canvas in the
   element's own `color`, so the ink is set here and the theme
   carries it. */
.ptc {
  position: relative;
  display: grid;
  place-items: center;}
.ptc-canvas {
  display: block;
  color: var(--fill-on, var(--ink));
  cursor: crosshair;
  touch-action: none;}

</style>
</head>

<div id="app" data-k></div>

const PRISTINE=(()=>{const c=document.documentElement.cloneNode(true);c.removeAttribute('data-theme');c.querySelectorAll('head > *, body > *').forEach(e=>{if(!e.hasAttribute('data-k'))e.remove()});return c})();

/* ---------- constants ---------- */
const PH=['Inisiasi','Pre-FEED','FEED','DED'];
const PH_COLOR={'Inisiasi':'#D29200','Pre-FEED':'#00A5AF','FEED':'#8764B8','DED':'#0F6CBD'};

/* ---------- state ---------- */
let S,DIRTY=false;
(function init(){
  let emb=null;try{emb=JSON.parse(document.getElementById('wl-state').textContent)}catch(e){}
  S=emb||seed();
  try{const d=JSON.parse(localStorage.getItem('wl-draft')||'null');if(d&&d.updatedAt>(S.updatedAt||0)){S=d;if(window.claude){DIRTY=true;setTimeout(()=>toast('Draf yang belum disimpan dipulihkan','warn'),600)}}}catch(e){}
  /* GitHub mode: edits made offline, or not yet sent, are still waiting on this device */
  try{if(!window.claude&&localStorage.getItem('wl-gh')&&localStorage.getItem('wl-gh-dirty')==='1')DIRTY=true}catch(e){}
})();
let REV=0;
function markDirty(){DIRTY=true;REV++;S.updatedAt=Date.now();try{localStorage.setItem('wl-draft',JSON.stringify(S))}catch(e){}if(GH&&GHOK){try{localStorage.setItem('wl-gh-dirty','1')}catch(e){}ghSchedule()}else updateSave()}
const uid=p=>p+Math.random().toString(36).slice(2,8);

/* ---------- GitHub sync ----------
   The data lives in one JSON file in a PRIVATE repo, read and written
   through the GitHub contents API with a fine-grained token that only
   reaches that repo. Every device that has the token sees the same data.
   - changes are sent 2.5 s after the last edit; each send is a commit
   - the file's sha is the version: a write made on a stale sha is refused
     by GitHub, which is how two devices editing at once are caught
   - other devices are checked every 30 s (a conditional request, so an
     unchanged file costs nothing against the rate limit)
   - offline: the edit stays on the device, flagged, and goes up later
   The page inside claude.ai cannot reach api.github.com, so it is off there. */
const GHOK=!window.claude;
let GH=null,ghSha=null,ghEtag=null,ghBusy=false,ghTimer=0,ghPoll=0,SYNC='off',SYNC_MSG='',conflictOpen=false;
try{GH=JSON.parse(localStorage.getItem('wl-gh')||'null');ghSha=localStorage.getItem('wl-gh-sha')||null}catch(e){}
const b64e=t=>{const u=new TextEncoder().encode(t);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
const b64d=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const ghPath=()=>GH.path.split('/').map(encodeURIComponent).join('/');
function ghFetch(method,body,etag,url){
  const h={Accept:'application/vnd.github+json',Authorization:'Bearer '+GH.token};
  if(body)h['Content-Type']='application/json';
  if(etag)h['If-None-Match']=etag;
  const u=url||`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${ghPath()}`+(method==='GET'?`?ref=${encodeURIComponent(GH.branch)}`:'');
  return fetch(u,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}
  if(r.status===401)return new Error('Token ditolak atau sudah kedaluwarsa. Buat token baru.');
  if(r.status===403)return new Error(/rate limit/i.test(m)?'Batas permintaan GitHub tercapai, coba lagi sebentar lagi.':'Token tidak punya izin tulis. Pada token, set Contents ke Read and write.');
  if(r.status===404)return new Error('Repo atau branch tidak ditemukan, atau token tidak punya akses ke repo itu.');
  return new Error(m||('GitHub menjawab '+r.status));}
const ghNet=e=>e&&e.name==='TypeError'?new Error('Tidak ada koneksi. Perubahan aman di perangkat ini dan dikirim saat online.'):e;
function setSync(st,msg=''){SYNC=st;SYNC_MSG=msg;updateSave();const el=$('#ghStatus');if(el)el.innerHTML=ghStatusHtml()}
function ghStatusHtml(){if(!GH)return '';const m={ok:['b-opt','Tersinkron'],saving:['b-avail','Menyimpan…'],dirty:['b-avail','Menunggu dikirim'],load:['b-avail','Memuat…'],err:['b-over','Gagal']}[SYNC]||['b-neutral','Siap'];return `<span class="badge ${m[0]}">${m[1]}</span>${SYNC_MSG?` <span class="muted" style="font-size:12px">${esc(SYNC_MSG)}</span>`:''}`}
function ghFlag(v){try{localStorage.setItem('wl-gh-dirty',v?'1':'')}catch(e){}}
function ghStore(sha){ghSha=sha;try{localStorage.setItem('wl-gh-sha',sha||'');localStorage.setItem('wl-draft',JSON.stringify(S))}catch(e){}}
function ghValid(o){return o&&Array.isArray(o.projects)&&Array.isArray(o.people)&&Array.isArray(o.assigns)&&o.settings&&o.settings.phaseW}
function ghAdopt(o,sha){const d=seed();o.settings=Object.assign({},d.settings,o.settings);S=o;DIRTY=false;ghFlag(false);ghStore(sha)}
function ghSchedule(){if(!GH||!GHOK)return;if(SYNC!=='saving')setSync('dirty');clearTimeout(ghTimer);ghTimer=setTimeout(()=>ghPush(),2500)}
async function ghPush(force){
  if(!GH||!GHOK||ghBusy||conflictOpen)return;
  clearTimeout(ghTimer);ghBusy=true;setSync('saving');
  const rev=REV;
  try{
    if(force){const r=await ghFetch('GET');if(r.ok)ghSha=(await r.json()).sha;else if(r.status===404)ghSha=null;else throw await ghErr(r)}
    const body={message:'Workload by YMD: '+new Date().toISOString().slice(0,16).replace('T',' '),content:b64e(JSON.stringify(S)),branch:GH.branch};
    if(ghSha)body.sha=ghSha;
    const r=await ghFetch('PUT',body);
    if(r.status===409||r.status===422){ghBusy=false;await ghConflict();return}
    if(!r.ok)throw await ghErr(r);
    const j=await r.json();ghEtag=null;ghStore(j.content.sha);
    /* an edit made while this was in flight is still waiting */
    if(REV===rev){DIRTY=false;ghFlag(false);setSync('ok')}else{ghBusy=false;ghSchedule()}
  }catch(e){setSync('err',ghNet(e).message)}
  finally{ghBusy=false}
}
async function ghPull(initial){
  if(!GH||!GHOK||ghBusy||conflictOpen)return;
  try{
    if(initial)setSync('load');
    const r=await ghFetch('GET',null,initial?null:ghEtag);
    if(r.status===304)return;
    if(r.status===404){
      /* the repo is there but the file is not: this device makes it */
      const rr=await ghFetch('GET',null,null,`https://api.github.com/repos/${GH.owner}/${GH.repo}`);
      if(!rr.ok)throw await ghErr(r);
      ghSha=null;await ghPush();return}
    if(!r.ok)throw await ghErr(r);
    ghEtag=r.headers.get('ETag');
    const j=await r.json();
    if(j.sha===ghSha){if(!DIRTY)setSync('ok');else ghSchedule();return}
    let o;try{o=JSON.parse(b64d(j.content))}catch(e){throw new Error('Isi file di GitHub bukan JSON yang valid')}
    if(!ghValid(o))throw new Error('Isi file di GitHub bukan data Workload')
    if(DIRTY){await ghConflict(j,o);return}
    ghAdopt(o,j.sha);setSync('ok');render();toast(initial?'Data dimuat dari GitHub':'Data diperbarui dari perangkat lain')
  }catch(e){setSync('err',ghNet(e).message)}
}
/* two versions: the file on GitHub moved on while this device was
   holding changes. Nothing is overwritten until one is picked */
async function ghConflict(j,o){
  if(conflictOpen)return;
  try{
    if(!j){const r=await ghFetch('GET');if(r.status===404){ghSha=null;return ghPush()}if(!r.ok)throw await ghErr(r);j=await r.json();o=JSON.parse(b64d(j.content))}
  }catch(e){setSync('err',ghNet(e).message);return}
  conflictOpen=true;setSync('err','Data berbeda di GitHub');
  const sum=d=>`${(d.projects||[]).length} proyek · ${(d.people||[]).length} personel · ${(d.assigns||[]).length} penugasan`;
  const when=d=>d.updatedAt?new Date(d.updatedAt).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'data contoh';
  openDialog(`<div class="dh"><h3>Data berbeda</h3></div><p>Data di GitHub sudah diubah dari perangkat lain, sementara perangkat ini juga punya perubahan yang belum terkirim. Pilih versi yang dipakai.</p>
  <div class="compare" style="grid-template-columns:1fr 1fr;text-align:left"><div class="card" style="box-shadow:none;border:1px solid var(--border)"><b>Di GitHub</b><div class="muted" style="font-size:12px">${when(o)}</div><div style="margin-top:6px">${sum(o)}</div></div><div class="card" style="box-shadow:none;border:1px solid var(--border)"><b>Di perangkat ini</b><div class="muted" style="font-size:12px">${when(S)}</div><div style="margin-top:6px">${sum(S)}</div></div></div>
  <div class="foot"><button class="btn" id="cfRemote">Pakai versi GitHub</button><button class="btn primary" id="cfLocal">Timpa dengan versi ini</button></div>`);
  $('#cfRemote').onclick=()=>{closeDialog();ghAdopt(o,j.sha);setSync('ok');render();toast('Memakai versi GitHub')};
  $('#cfLocal').onclick=()=>{closeDialog();ghSha=j.sha;ghPush()};
}
async function ghConnect(d){
  const m=String(d.repo||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/^\/|\/$/g,'').match(/^([\w.-]+)\/([\w.-]+)$/);
  if(!m){toast('Tulis repo sebagai pemilik/nama, misalnya Malegiw/workload-data','err');return}
  const token=String(d.token||'').trim();if(!token){toast('Token belum diisi','err');return}
  GH={owner:m[1],repo:m[2],path:(String(d.path||'data.json').trim()||'data.json').replace(/^\//,''),branch:String(d.branch||'main').trim()||'main',token};
  try{const r=await ghFetch('GET',null,null,`https://api.github.com/repos/${GH.owner}/${GH.repo}`);
    if(!r.ok){const e=await ghErr(r);GH=null;toast(e.message,'err');return}
    const info=await r.json();if(!info.private&&!confirm_public()){GH=null;return}
  }catch(e){GH=null;toast(ghNet(e).message,'err');return}
  try{localStorage.setItem('wl-gh',JSON.stringify(GH));localStorage.removeItem('wl-gh-sha')}catch(e){}
  ghSha=null;ghEtag=null;
  /* a device that already holds edits asks before it takes the remote's */
  DIRTY=S.updatedAt>0;ghFlag(DIRTY);
  ghStart();await ghPull(true);render();if(SYNC==='ok')toast('Tersambung ke GitHub')
}
/* a public data repo would put the names and workloads on the open web */
function confirm_public(){toast('Repo data harus Private. Ubah di Settings repo, bagian Danger Zone → Change visibility.','err');return false}
function ghStart(){clearInterval(ghPoll);if(!GH||!GHOK)return;ghPoll=setInterval(()=>{if(document.hidden||ghBusy||conflictOpen)return;if(DIRTY)ghPush();else ghPull()},30000)}
function ghDisconnect(){clearInterval(ghPoll);clearTimeout(ghTimer);GH=null;ghSha=null;ghEtag=null;SYNC='off';SYNC_MSG='';try{['wl-gh','wl-gh-sha','wl-gh-dirty'].forEach(k=>localStorage.removeItem(k))}catch(e){}updateSave()}
function ghBoot(){if(!GH||!GHOK)return;ghStart();ghPull(true);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(DIRTY)ghPush();else ghPull()}});
  addEventListener('online',()=>{if(DIRTY)ghPush();else ghPull()});
  addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}})}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0=n=>Math.round(n).toLocaleString('id-ID');
const f1=n=>(Math.round(n*10)/10).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const f2=n=>(+n).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);
function tween(dur,fn){if(RM){fn(1);return}const t0=performance.now();(function f(now){const t=clamp((now-t0)/dur,0,1);fn(ease(t));if(t<1)requestAnimationFrame(f)})(t0)}
function rollNum(el,to,fmt=f0){const from=+(el.dataset.v||0);el.dataset.v=to;tween(900,t=>el.textContent=fmt(from+(to-from)*t))}
const proj=id=>S.projects.find(p=>p.id===id);
const person=id=>S.people.find(e=>e.id===id);
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const pDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fDate=s=>pDate(s).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'2-digit'});

/* ---------- calculation engine ---------- */
function aLoad(a){const p=proj(a.p),e=person(a.e);if(!p||!e)return 0;const st=S.settings;
  return (st.phaseW[p.phase]??0)*((st.roleF[e.role]||{})[p.phase]??1)*(st.cxF[p.cx]??1)*a.alloc*(1-p.progress/100)}
const active=(p,d0,d1)=>pDate(p.start)<=d1&&pDate(p.end)>=d0;
function util(eid,d0,d1){const e=person(eid);if(!e)return 0;let s=0;for(const a of S.assigns)if(a.e===eid){const p=proj(a.p);if(!p)continue;if(d0&&!active(p,d0,d1))continue;s+=aLoad(a)}return s*100/effCap(e)}
function status(u){const t=S.settings.thr;return u>t.high?'over':u>=t.low?'opt':'avail'}
const ST_LABEL={avail:'Tersedia',opt:'Optimal',over:'Overload'};
const ST_COLOR=u=>({avail:'var(--accent)',opt:'var(--success)',over:'var(--danger)'})[status(u)];
const badge=u=>`<span class="badge b-${status(u)}">${ST_LABEL[status(u)]}</span>`;
function roleUtil(role,d0,d1){const ms=S.people.filter(e=>e.role===role);if(!ms.length)return 0;const cap=ms.reduce((s,e)=>s+effCap(e),0);return ms.reduce((s,e)=>s+util(e.id,d0,d1)*effCap(e)/100,0)*100/cap}
function weeks(n=12){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return Array.from({length:n},(_,i)=>{const s=new Date(d);s.setDate(d.getDate()+i*7);const e=new Date(s);e.setDate(s.getDate()+6);return {s,e,l:s.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})}})}
function months(n=12,back=3){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()-back);return Array.from({length:n},(_,i)=>{const s=new Date(d.getFullYear(),d.getMonth()+i,1);const e=new Date(d.getFullYear(),d.getMonth()+i+1,0);return {s,e,l:s.toLocaleDateString('id-ID',{month:'short',year:'2-digit'})}})}
const projLoad=pid=>S.assigns.filter(a=>a.p===pid).reduce((s,a)=>s+aLoad(a),0);
const team=pid=>S.assigns.filter(a=>a.p===pid).map(a=>person(a.e)).filter(Boolean);

/* ---------- icons ---------- */
const IC={
 dash:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/>',
 proj:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 ppl:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3 3-5 6-5s5.4 2 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14c2.4 0 4.3 1.6 5 4"/>',

/* ---------- pages ---------- */
const PAGES={},MOUNT={};
PAGES.dashboard=()=>{
  const ppl=S.people,u=ppl.map(e=>util(e.id));const avg=u.reduce((s,v)=>s+v,0)/(u.length||1);const over=ppl.filter((e,i)=>u[i]>S.settings.thr.high);const avail=ppl.filter((e,i)=>u[i]<S.settings.thr.low);
  const W=weeks(12);const wAvg=W.map(w=>ppl.reduce((s,e)=>s+util(e.id,w.s,w.e),0)/(ppl.length||1));
  const attn=ppl.map(e=>({e,u:util(e.id)})).sort((a,b)=>b.u-a.u).slice(0,6);
  return `<div class="page-head"><div><h1>Dashboard beban kerja</h1><p>Ringkasan utilisasi tim engineering per disiplin dan fase pekerjaan</p></div><div class="actions"><button class="btn primary" data-act="newAssign">${ic('plus',16)}Penugasan</button></div></div>
  <div class="grid g4">
    <div class="card kpi"><div class="lab">${ic('proj',16)}Proyek aktif</div><div class="row"><div class="val" data-roll="${S.projects.length}">0</div></div><div class="sub">${PH.map(ph=>`${S.projects.filter(p=>p.phase===ph).length} ${ph}`).join(' · ')}</div></div>
    <div class="card kpi"><div class="lab">${ic('ppl',16)}Personel</div><div class="row"><div class="val" data-roll="${ppl.length}">0</div>${avGroup(ppl,5)}</div><div class="sub">${ROLES.length} disiplin termasuk DocCon</div></div>
    <div class="card kpi"><div class="lab">${ic('ana',16)}Utilisasi rata-rata</div><div class="row"><div class="val"><span data-roll="${avg}">0</span><small>%</small></div>${badge(avg)}</div>${spark(wAvg,'var(--accent)')}</div>
    <div class="card kpi"><div class="lab">${ic('warn',16)}Overload &gt; ${S.settings.thr.high}%</div><div class="row"><div class="val" style="color:${over.length?'var(--danger)':'inherit'}" data-roll="${over.length}">0</div>${over.length?avGroup(over,4):'<span class="badge b-opt">Aman</span>'}</div><div class="sub">${avail.length} personel masih tersedia (&lt; ${S.settings.thr.low}%)</div></div>
  </div>
  <div class="grid g2 mt">
    <div class="card"><div class="card-head"><div><h2>Proyek per fase</h2><div class="sub">DED berbobot paling besar</div></div><div class="right">${seg('donut',['Jumlah','Beban'],UI.donutMode==='count'?'Jumlah':'Beban')}</div></div><div id="donut"></div></div>
    <div class="card"><div class="card-head"><div><h2>Utilisasi per disiplin</h2><div class="sub">Garis putus: batas optimal 70% dan overload 100%</div></div></div><div id="bars"></div></div>
  </div>
  <div class="grid g3 mt">
    <div class="card" style="padding:0;display:grid;justify-items:center"><div id="ctx"></div></div>
    <div class="card"><div class="card-head"><div><h2>Proyek beban tertinggi</h2><div class="sub">Tekan atau lempar kartu depan</div></div></div><div id="csw"></div><div class="csw-info" id="cswInfo"></div></div>
    <div class="card"><div class="card-head"><div><h2>Perlu perhatian</h2><div class="sub">Utilisasi tertinggi saat ini</div></div></div><div class="list-att">${attn.map(a=>`<div class="r click" data-act="openPerson" data-id="${a.e.id}" style="cursor:pointer">${avatar(a.e)}<div><div style="font-weight:600">${esc(a.e.name)}</div><div class="muted" style="font-size:12px">${esc(a.e.role)}</div></div>${meter(a.u)}</div>`).join('')}</div></div>
  </div>
  <div class="card mt"><div class="card-head"><div><h2>Heatmap 12 minggu ke depan</h2><div class="sub">Personel × minggu, berdasarkan periode proyek aktif</div></div></div><div id="hm"></div></div>`;
};
MOUNT.dashboard=()=>{
  $$('[data-roll]').forEach(el=>{const v=+el.dataset.roll;el.dataset.v=0;tween(900,t=>el.textContent=f0(v*t))});
  mountCtx();mountCsw();drawDonut();barChart($('#bars'),ROLES.map(r=>({label:r,short:ROLE_SHORT[r],value:roleUtil(r)})));heatmap($('#hm'));
};
function drawDonut(){const el=$('#donut');if(!el)return;const byLoad=UI.donutMode==='load';donut(el,PH.slice().reverse().map(ph=>({label:ph,color:PH_COLOR[ph],value:byLoad?S.projects.filter(p=>p.phase===ph).reduce((s,p)=>s+projLoad(p.id),0)/100:S.projects.filter(p=>p.phase===ph).length})),byLoad?'beban (FTE)':'proyek',byLoad?f1:f0)}

PAGES.proyek=()=>`<div class="page-head"><div><h1>Proyek</h1><p>Klik fase untuk mengubahnya, klik baris untuk detail tim</p></div><div class="actions"><button class="btn" data-act="imp">${ic('ul',16)}Impor Excel</button><button class="btn primary" data-act="newProject">${ic('plus',16)}Proyek baru</button></div></div>
  <div class="card">${table('proj',[
    {key:'id',label:'Kode',render:p=>`<span class="code">${esc(p.id)}</span>`},
    {key:'name',label:'Nama proyek',render:p=>`<div style="font-weight:600">${esc(p.name)}</div><div class="muted" style="font-size:12px">${esc(p.fac)}</div>`},
    {key:'phase',label:'Fase',val:p=>PH.indexOf(p.phase),render:phasePill},
    {key:'cx',label:'Kompleksitas',render:p=>`${'●'.repeat(p.cx)}<span class="muted">${'●'.repeat(3-p.cx)}</span> ${CX_LABEL[p.cx]}`},
    {key:'start',label:'Periode',render:p=>`<span style="white-space:nowrap">${fDate(p.start)} – ${fDate(p.end)}</span>`},
    {key:'progress',label:'Progres',num:1,render:p=>`<div class="pcell">${pbar(p.progress,PH_COLOR[p.phase])}<span>${p.progress}%</span></div>`},
    {key:'team',label:'Tim',nosort:1,render:p=>avGroup(team(p.id),5)},
    {key:'load',label:'Beban (FTE)',num:1,val:p=>projLoad(p.id),render:p=>`<b>${f2(projLoad(p.id)/100)}</b>`}
  ],S.projects,{rowAct:'openProject',sort:{key:'id',dir:'asc'}})}</div>`;

PAGES.personel=()=>{const f=UI.pFilter;const list=S.people.filter(e=>f==='Semua'||ROLE_SHORT[e.role]===f).map(e=>({e,u:util(e.id)}));const W=weeks(12);
  return `<div class="page-head"><div><h1>Personel</h1><p>Utilisasi tiap engineer, lead project, dan DocCon</p></div><div class="actions"><button class="btn primary" data-act="newPerson">${ic('plus',16)}Personel baru</button></div></div>
  <div style="margin-bottom:16px">${seg('pf',['Semua',...ROLES.map(r=>ROLE_SHORT[r])],f)}</div>
  <div class="pgrid">${list.map(({e,u},i)=>{const as=S.assigns.filter(a=>a.e===e.id);return `<div class="card pcard" style="animation-delay:${i*30}ms" data-act="openPerson" data-id="${e.id}"><div class="top">${avatar(e,'lg')}<div><div class="nm">${esc(e.name)}</div><div class="rl">${esc(e.role)} · ${esc(e.level||'Middle')} · ${e.cap}%</div><div style="margin-top:4px">${badge(u)}</div></div>${ring(u)}</div>${spark(W.map(w=>util(e.id,w.s,w.e)),ROLE_COLOR[e.role])}<div class="chips">${as.map(a=>{const p=proj(a.p);return p?`<span class="chip" data-tip="${esc(p.name)} · ${p.phase}\nAlokasi ${a.alloc}% → beban ${f1(aLoad(a))}%"><i style="background:${PH_COLOR[p.phase]}"></i>${esc(p.id)} · ${f0(aLoad(a))}%</span>`:''}).join('')||'<span class="muted" style="font-size:12px">Belum ada penugasan</span>'}</div></div>`}).join('')}</div>`};
MOUNT.personel=()=>animateRings();

PAGES.penugasan=()=>{const f=UI.aFilter;const rows=S.assigns.filter(a=>!f||a.p===f).map(a=>({...a,pp:proj(a.p),ee:person(a.e)})).filter(r=>r.pp&&r.ee);
  return `<div class="page-head"><div><h1>Penugasan</h1><p>Pasang personel ke proyek dan lihat dampaknya terhadap utilisasi</p></div><div class="actions"><button class="btn" data-act="imp">${ic('ul',16)}Impor Excel</button></div></div>
  <div class="grid g-12">
    <div class="card"><h2>Penugasan baru</h2><div class="sub" style="margin-bottom:14px">Pratinjau utilisasi diperbarui langsung</div>${assignForm()}</div>
    <div class="card"><div class="card-head"><div><h2>Daftar penugasan</h2><div class="sub">${rows.length} penugasan</div></div><div class="right"><select class="in" style="width:auto" data-in="aFilter"><option value="">Semua proyek</option>${S.projects.map(p=>`<option value="${p.id}" ${p.id===f?'selected':''}>${esc(p.id)} · ${esc(p.name)}</option>`).join('')}</select></div></div>
    ${table('asg',[
      {key:'p',label:'Proyek',render:r=>`<span class="code">${esc(r.p)}</span> ${esc(r.pp.name)}`},
      {key:'phase',label:'Fase',val:r=>PH.indexOf(r.pp.phase),render:r=>`<span class="chip"><i style="background:${PH_COLOR[r.pp.phase]}"></i>${r.pp.phase}</span>`},
      {key:'e',label:'Personel',val:r=>r.ee.name,render:r=>`<span style="display:inline-flex;align-items:center;gap:8px">${avatar(r.ee)}${esc(r.ee.name)}</span>`},
      {key:'role',label:'Disiplin',val:r=>r.ee.role,render:r=>esc(ROLE_SHORT[r.ee.role])},
      {key:'alloc',label:'Alokasi',num:1,render:r=>`<input class="in rf" type="number" min="0" max="100" step="5" value="${r.alloc}" data-in="alloc" data-id="${r.id}">`},
      {key:'load',label:'Beban',num:1,val:r=>aLoad(r),render:r=>`<b>${f1(aLoad(r))}%</b>`},
      {key:'x',label:'',nosort:1,render:r=>`<button class="btn subtle icon-btn danger" data-act="delAssign" data-id="${r.id}" aria-label="Hapus">${ic('trash',16)}</button>`}
    ],rows,{sort:{key:'p',dir:'asc'}})}</div></div>`};
function assignForm(pid=''){return `<form data-form="assign" id="aform"><div class="field"><label>Proyek</label><select class="in" name="p" data-in="aprev">${S.projects.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.id)} · ${esc(p.name)} (${p.phase})</option>`).join('')}</select></div>
  <div class="field"><label>Personel</label><select class="in" name="e" data-in="aprev">${ROLES.map(r=>`<optgroup label="${esc(r)}">${S.people.filter(e=>e.role===r).map(e=>`<option value="${e.id}">${esc(e.name)} · ${f0(util(e.id))}%</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div class="field"><label>Alokasi waktu</label><div class="range"><input type="range" name="alloc" min="5" max="100" step="5" value="30" data-in="aprev"><output>30%</output></div></div>
  <div id="aprev"></div><div class="foot" style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" type="submit">${ic('plus',16)}Tambahkan</button></div></form>`}
function updAssignPreview(){const f=$('#aform');if(!f)return;const fd=new FormData(f);const p=proj(fd.get('p')),e=person(fd.get('e'));const al=+fd.get('alloc');const r=$('input[type=range]',f);r.style.setProperty('--p',(al-5)/95*100+'%');$('output',f).textContent=al+'%';if(!p||!e)return;
  const before=util(e.id);const add=aLoad({p:p.id,e:e.id,alloc:al})*100/effCap(e);const after=before+add;const dup=S.assigns.some(a=>a.p===p.id&&a.e===e.id);
  $('#aprev').innerHTML=`<div class="compare"><div><div class="muted" style="font-size:12px">Sekarang</div><div class="big" style="color:${ST_COLOR(before)}">${f0(before)}%</div>${badge(before)}</div><div class="muted">${ic('chev')}</div><div><div class="muted" style="font-size:12px">Setelah (+${f1(add)}%)</div><div class="big" style="color:${ST_COLOR(after)}">${f0(after)}%</div>${badge(after)}</div></div>
  <div class="formula">${f2(S.settings.phaseW[p.phase])} (${p.phase}) × ${f2((S.settings.roleF[e.role]||{})[p.phase]??1)} (${esc(ROLE_SHORT[e.role])}) × ${f2(S.settings.cxF[p.cx])} (${CX_LABEL[p.cx]}) × ${al}% × (1 − ${p.progress}%) = ${f1(aLoad({p:p.id,e:e.id,alloc:al}))}%</div>
  ${dup?`<div class="warnbox">${ic('warn',16)}<span>${esc(e.name)} sudah ada di ${esc(p.id)}. Alokasi akan ditambahkan ke penugasan yang ada.</span></div>`:''}
  ${after>S.settings.thr.high?`<div class="warnbox">${ic('warn',16)}<span>Utilisasi ${esc(e.name)} akan melewati ${S.settings.thr.high}%. Pertimbangkan personel lain dari disiplin ${esc(ROLE_SHORT[e.role])}${(()=>{const alt=S.people.filter(x=>x.role===e.role&&x.id!==e.id).sort((a,b)=>util(a.id)-util(b.id))[0];return alt?`, misalnya ${esc(alt.name)} (${f0(util(alt.id))}%)`:''})()}.</span></div>`:''}`;
}
MOUNT.penugasan=()=>updAssignPreview();

PAGES.analisis=()=>`<div class="page-head"><div><h1>Analisis disiplin</h1><p>Distribusi beban per fase dan tren bulanan</p></div></div>
  <div class="grid g2"><div class="card"><div class="card-head"><div><h2>Beban per disiplin per fase</h2><div class="sub">Persentase terhadap kapasitas disiplin</div></div></div><div id="sb"></div></div>
  <div class="card"><div class="card-head"><div><h2>Komposisi beban per fase</h2><div class="sub">1 sel = 1% dari total beban</div></div></div><div style="margin-bottom:12px">${seg('wf',['Semua',...ROLES.map(r=>ROLE_SHORT[r])],UI.wRole)}</div><div id="wf"></div></div></div>
  <div class="card mt"><div class="card-head"><div><h2>Tren utilisasi bulanan</h2><div class="sub">Rata-rata per disiplin; kolom biru muda = bulan ini. Klik legenda untuk menyembunyikan seri.</div></div></div><div id="lc"></div></div>
  <div class="card mt"><div class="card-head"><div><h2>Struktur beban: disiplin → personel → proyek</h2></div><div class="right"><button class="btn sm" data-act="treeAll">Buka/tutup semua</button></div></div><div id="tree">${treeTable()}</div></div>`;
MOUNT.analisis=()=>{stacked($('#sb'));waffle($('#wf'));lineChart($('#lc'))};
function treeTable(){let h=`<div class="tw"><table class="t tree"><thead><tr><th>Nama</th><th>Fase / peran</th><th class="num">Alokasi</th><th>Utilisasi / beban</th></tr></thead><tbody>`;
  ROLES.forEach(r=>{const ms=S.people.filter(e=>e.role===r);const ru=roleUtil(r);const o=UI.open[r];
    h+=`<tr class="lvl0"><td><button class="tg ${o?'open':''}" data-act="tree" data-k="${esc(r)}">${ic('chev',14)}</button> ${esc(r)} <span class="muted" style="font-weight:400">(${ms.length})</span></td><td></td><td></td><td>${meter(ru)}</td></tr>`;
    if(o)ms.forEach(e=>{const u=util(e.id),ok=UI.open[e.id];const as=S.assigns.filter(a=>a.e===e.id);
      h+=`<tr class="enter"><td class="ind1"><button class="tg ${ok?'open':''}" data-act="tree" data-k="${e.id}">${ic('chev',14)}</button> <span style="display:inline-flex;align-items:center;gap:8px;vertical-align:middle">${avatar(e)}${esc(e.name)}</span></td><td>${badge(u)}</td><td class="num">${as.reduce((s,a)=>s+a.alloc,0)}%</td><td>${meter(u)}</td></tr>`;
      if(ok)as.forEach(a=>{const p=proj(a.p);if(!p)return;h+=`<tr class="enter"><td class="ind2"><span class="code">${esc(p.id)}</span> ${esc(p.name)}</td><td><span class="chip"><i style="background:${PH_COLOR[p.phase]}"></i>${p.phase}</span></td><td class="num">${a.alloc}%</td><td>${f1(aLoad(a))}%</td></tr>`})})});
  return h+'</tbody></table></div>'}

function ghCard(){
  if(!GHOK)return `<div class="card mt"><h2>Sinkronisasi GitHub</h2><div class="sub" style="margin-bottom:12px">Agar data sama di HP, iPad, dan laptop</div><div class="warnbox" style="background:var(--surface-3);color:var(--foreground)"><span>Fitur ini aktif di versi GitHub Pages. Halaman di dalam claude.ai tidak boleh menghubungi GitHub, jadi di sini data tetap disimpan lewat tombol Simpan.</span></div></div>`;
  if(GH)return `<div class="card mt"><div class="card-head"><div><h2>Sinkronisasi GitHub</h2><div class="sub">Data dibagikan lewat file ${esc(GH.path)} di repo privat ${esc(GH.owner)}/${esc(GH.repo)} (branch ${esc(GH.branch)})</div></div><div class="right" id="ghStatus">${ghStatusHtml()}</div></div>
    <div class="muted" style="font-size:13px;margin-bottom:14px">Perubahan dikirim otomatis beberapa detik setelah Anda berhenti mengedit. Perangkat lain memeriksa pembaruan tiap 30 detik. Token tersimpan hanya di browser perangkat ini.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="ghSync">${ic('reset',16)}Sinkronkan sekarang</button><button class="btn danger" data-act="ghOff">Putuskan</button></div></div>`;
  return `<div class="card mt"><h2>Sinkronisasi GitHub</h2><div class="sub" style="margin-bottom:14px">Agar data sama di HP, iPad, dan laptop. Ulangi pengisian ini sekali di tiap perangkat.</div>
    <form data-form="gh"><div class="row2"><div class="field"><label>Repo data</label><input class="in" name="repo" placeholder="Malegiw/workload-data" autocomplete="off" autocapitalize="off" required><div class="hint">Harus repo Private, terpisah dari repo aplikasi</div></div><div class="field"><label>Token</label><input class="in" type="password" name="token" placeholder="github_pat_…" autocomplete="off" required><div class="hint">Fine-grained token dengan Contents: Read and write</div></div></div>
    <div class="row2"><div class="field"><label>File data</label><input class="in" name="path" value="data.json"></div><div class="field"><label>Branch</label><input class="in" name="branch" value="main"></div></div>
    <button class="btn primary" type="submit">Hubungkan</button></form></div>`}
function explainCard(){const st=S.settings,lv=st.lvF||LVF0;
  const ex={ph:'DED',role:'Civil/Structure',cx:3,al:50,pr:20,lvl:'Senior',cap:100};
  const w=st.phaseW[ex.ph],rf=(st.roleF[ex.role]||{})[ex.ph]??1,cf=st.cxF[ex.cx],lf=lv[ex.lvl],ld=w*rf*cf*ex.al*(1-ex.pr/100),ec=ex.cap*lf,u=ld*100/ec;
  const tf=S.people.reduce((s,e)=>s+(e.cap||100),0)/100,te=S.people.reduce((s,e)=>s+effCap(e),0)/100;
  return `<div class="card mt"><h2>Cara membaca angka</h2><div class="sub" style="margin-bottom:14px">Penjelasan FTE, level, dan rumus perhitungan</div>
  <div class="grid g2" style="gap:20px">
   <div><h3 style="margin:0 0 6px">Apa itu FTE?</h3><p class="muted" style="margin:0 0 10px;font-size:13px;line-height:20px">FTE (Full-Time Equivalent) adalah satuan beban kerja setara satu orang bekerja penuh waktu. 1,0 FTE berarti pekerjaan yang menghabiskan seluruh waktu satu personel level Middle. 0,5 FTE berarti setengahnya.</p>
    <ul class="muted" style="margin:0;padding-left:18px;font-size:13px;line-height:21px"><li><b>Beban (FTE)</b> di halaman Proyek = jumlah beban semua penugasan proyek itu, dibagi 100. Sudah memakai bobot fase, peran, dan kompleksitas, jadi bukan sekadar jumlah orang.</li><li><b>Kapasitas tim</b> sekarang ${f2(tf)} FTE nominal, atau ${f2(te)} FTE efektif setelah faktor level.</li><li>Alokasi 100% pada fase DED, kompleksitas Sedang, semua faktor 1,0 menghasilkan 1,0 FTE.</li></ul></div>
   <div><h3 style="margin:0 0 6px">Level personel</h3><p class="muted" style="margin:0 0 10px;font-size:13px;line-height:20px">Setiap personel punya level. Faktor level mengalikan kapasitas, jadi senior yang dialokasikan pada pekerjaan yang sama terlihat lebih longgar, dan junior lebih cepat penuh.</p>
    <table class="t"><thead><tr><th>Level</th><th class="num">Faktor</th><th class="num">Kapasitas 100% menjadi</th></tr></thead><tbody>${LV.map(l=>`<tr><td>${LV_LABEL[l]}</td><td class="num">${f2(lv[l])}</td><td class="num">${f2(lv[l])} FTE</td></tr>`).join('')}</tbody></table></div>
  </div>
  <h3 style="margin:18px 0 6px">Contoh hitungan</h3>
  <div class="formula">Personel Senior, Civil/Structure, kapasitas ${ex.cap}%, dialokasikan ${ex.al}% pada proyek DED kompleksitas Tinggi, progres ${ex.pr}%<br>Beban = ${f2(w)} × ${f2(rf)} × ${f2(cf)} × ${ex.al} × (1 − ${ex.pr/100}) = <b>${f2(ld)}</b> (${f2(ld/100)} FTE)<br>Kapasitas efektif = ${ex.cap} × ${f2(lf)} = <b>${f2(ec)}</b><br>Utilisasi = ${f2(ld)} ÷ ${f2(ec)} = <b>${f2(u)}%</b> → ${ST_LABEL[status(u)]}</div>
  <ul class="muted" style="margin:12px 0 0;padding-left:18px;font-size:13px;line-height:21px"><li><b>Bobot fase</b>: DED paling berat, lalu FEED, Pre-FEED, dan Inisiasi.</li><li><b>Faktor peran</b>: seberapa besar keterlibatan sebuah disiplin pada tiap fase.</li><li><b>Alokasi</b>: porsi waktu personel pada proyek. Progres yang naik mengurangi beban yang tersisa.</li><li><b>Utilisasi</b>: di bawah ${st.thr.low}% Tersedia, ${st.thr.low} sampai ${st.thr.high}% Optimal, di atas ${st.thr.high}% Overload.</li></ul></div>`}
PAGES.pengaturan=()=>{const st=S.settings;return `<div class="page-head"><div><h1>Pengaturan</h1><p>Bobot perhitungan dan pengelolaan data</p></div></div>
  <div class="grid g2">
   <div class="card"><h2>Bobot fase</h2><div class="sub" style="margin-bottom:16px">DED > FEED > Pre-FEED > Inisiasi</div>
